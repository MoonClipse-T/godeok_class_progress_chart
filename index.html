<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
<title>고덕중 진도표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 교무수첩 종이 · 칠판 초록 · 형광펜(오늘/수업 중) · 빨간펜(시간표 변경) */
:root {
  /* 글자색은 종이·흰 바탕 모두에서 4.5:1 이상 (muted 7.4, faint 4.6) */
  --paper: #eef1f0; --surface: #ffffff; --sunk: #f5f7f6; --ink: #17202b; --muted: #4b5560; --faint: #646f78;
  --rule: #dce2df; --rule-2: #c3ccc8;
  --accent: #1d6b55; --accent-ink: #ffffff; --accent-soft: #dcefe7;
  --hl: #ffe15a; --hl-ink: #3d3200;
  --red: #d6283e; --red-soft: #fde7ea; --warn: #9a4f00; --warn-soft: #fff0d9;
  --event: #6b4fbb; --event-soft: #eeeafb;
  /* 차시 색(OKLCH): 같은 밝기·채도에서 색상(--h)만 바꿔 어느 차시든 대비가 같음. --t=1 인 차시는 *d 만큼 밝기를 옮김 */
  --kL: .905; --kC: .07; --kbL: .56; --kbC: .15; --kpL: .975; --kpC: .025; --klL: .76; --klC: .09;
  --kd: -.06; --kbd: -.08; --kpd: -.02;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --font: "Wanted Sans Variable", "Wanted Sans", "Pretendard Variable", Pretendard, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #101513; --surface: #18201d; --sunk: #1e2724; --ink: #e6ece9; --muted: #a9b4af; --faint: #818d88;
    --rule: #28322e; --rule-2: #3a4641;
    --accent: #5cc6a2; --accent-ink: #07140f; --accent-soft: #1b3a2f;
    --hl: #e3c343; --hl-ink: #241d00;
    --red: #ff6b7b; --red-soft: #3a1a20; --warn: #f5b14a; --warn-soft: #33260f;
    --event: #b9a6ff; --event-soft: #262140;
    --kL: .37; --kC: .07; --kbL: .78; --kbC: .12; --kpL: .24; --kpC: .025; --klL: .5; --klC: .07;
    --kd: .06; --kbd: .07; --kpd: .025;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; font-optical-sizing: auto; }
/* 자간은 크기별로: 큰 제목은 좁게(각 규칙에서), 12px 이하 작은 글씨는 살짝 넓게 */
.tl-cell .t, .tl-head .w, .ticket .when small, .tag, .count, .legend, .h-row .sub, .tl-bar .hint, nav.tabs button { letter-spacing: .01em; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
svg { width: 18px; height: 18px; flex: none; }

/* 누르면 살짝 눌림 */
.btn, .icon-btn, .ticket, .tl-cell > button, .seg button, nav.tabs button, .chips button { transition: transform 140ms var(--ease); }
.btn:active, .icon-btn:active, .ticket:active, .seg button:active, nav.tabs button:active, .chips button:active { transform: scale(.97); }
.tl-cell > button:active { transform: scale(.95); }

.app { max-width: 1280px; margin: 0 auto; padding: 0 16px calc(88px + env(safe-area-inset-bottom)); }
header.top { display: flex; align-items: center; gap: 14px; padding: 18px 0 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 19px; height: 19px; }
.brand b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.brand small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.sync i.old { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }

/* 휴대폰 아래 탭 막대: 시간표가 밑으로 비쳐 지나가는 반투명 재질, 위 가장자리는 빛 받는 밝은 선 */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
  background: color-mix(in srgb, var(--surface) 72%, transparent); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--surface) 60%, transparent), 0 -1px 0 var(--rule); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
@media (prefers-reduced-transparency: reduce) { nav.tabs { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media (prefers-contrast: more) { :root { --rule: var(--rule-2); --faint: var(--muted); } nav.tabs { background: var(--surface); } }
nav.tabs button { flex: 1; border: 0; background: none; padding: 6px 0 4px; font-size: 11.5px; font-weight: 700; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 12px; position: relative; }
nav.tabs button svg { width: 23px; height: 23px; }
nav.tabs button.on { color: var(--ink); }
nav.tabs button.on svg { color: var(--accent); }
nav.tabs .badge { position: absolute; top: 1px; left: calc(50% + 7px); background: var(--warn); color: #fff; font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
@media (min-width: 900px) {
  .app { padding-bottom: 40px; }
  header.top { padding: 22px 0 18px; }
  nav.tabs { position: static; order: 2; background: var(--sunk); border: 1px solid var(--rule); border-radius: 14px; padding: 3px; gap: 2px; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; }
  nav.tabs button { flex: none; white-space: nowrap; flex-direction: row; font-size: 14px; padding: 7px 15px; gap: 7px; border-radius: 11px; color: var(--muted); }
  nav.tabs button svg { width: 17px; height: 17px; }
  nav.tabs button.on { background: var(--surface); box-shadow: 0 1px 2px rgba(23,32,43,.08), 0 0 0 1px var(--rule); }
  nav.tabs .badge { position: static; margin-left: 1px; }
  .sync { order: 3; margin-left: 4px; }
  .brand { margin-right: auto; }
}

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; }
.h-row { display: flex; align-items: center; gap: 8px; margin: 26px 2px 10px; }
.h-row:first-child { margin-top: 0; }
.h-row h3 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.h-row .sub { font-size: 12.5px; color: var(--faint); }
.h-row .btn { margin-left: auto; }
.count { font-size: 12px; font-weight: 800; min-width: 22px; height: 20px; border-radius: 10px; display: inline-grid; place-items: center; padding: 0 6px; background: var(--sunk); color: var(--muted); border: 1px solid var(--rule); }
.count.red { background: var(--red); border-color: var(--red); color: #fff; }

.btn { border: 1px solid var(--rule-2); background: var(--surface); border-radius: 12px; padding: 9px 15px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled) { background: var(--sunk); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  .btn.ghost:hover { color: var(--ink); background: var(--sunk); }
}
.icon-btn { border: 1px solid var(--rule-2); background: var(--surface); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--muted); }

/* 반 이름표: 색 없이 글자로만 구분 */
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; padding: 2px 8px; border-radius: 7px; font-weight: 800; font-size: 14px; letter-spacing: -.01em; white-space: nowrap;
  background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule-2); }
.chip.lg { font-size: 17px; padding: 4px 11px; min-width: 58px; border-radius: 9px; }
.chip.solid { background: var(--ink); color: var(--paper); box-shadow: none; }
.chip.gone { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); text-decoration: line-through; text-decoration-thickness: 2px; }

/* 차시 색: .k 가 --k-bg(바탕) --k-bar(진한 색) --k-line(테두리)을 정함. tint 가 없으면 무채색 */
.k { --k-bg: var(--sunk); --k-bar: var(--ink); --k-line: var(--rule-2); }
.k.tint { --k-bg: oklch(calc(var(--kL) + var(--t, 0) * var(--kd)) var(--kC) var(--h)); --k-bar: oklch(calc(var(--kbL) + var(--t, 0) * var(--kbd)) var(--kbC) var(--h)); --k-line: oklch(var(--klL) var(--klC) var(--h)); }
.k.plan { --k-bg: var(--surface); --k-bar: var(--muted); }
.k.plan.tint { --k-bg: oklch(calc(var(--kpL) + var(--t, 0) * var(--kpd)) var(--kpC) var(--h)); --k-bar: oklch(calc(var(--kbL) + var(--t, 0) * var(--kbd)) var(--kbC) var(--h)); }
.k.over { --k-bg: transparent; --k-line: var(--rule); }
.step { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; font-size: 12.5px; font-weight: 800; background: var(--k-bar); color: var(--surface); flex: none; }
.plan .step { background: transparent; color: var(--k-bar); box-shadow: inset 0 0 0 1.5px var(--k-bar); }
.step.lg { min-width: 30px; height: 30px; border-radius: 15px; font-size: 15px; }
.tag { font-size: 11.5px; font-weight: 750; padding: 2px 8px; border-radius: 99px; white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }
.tag.chg { background: var(--red); color: #fff; }
.tag.event { background: var(--event-soft); color: var(--event); }
.tag.ok { background: var(--accent-soft); color: var(--accent); }
.tag svg { width: 12px; height: 12px; }

/* 오늘 */
.today-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
@media (min-width: 900px) { .today-layout { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 32px; align-items: start; } }
/* 옆으로 밀 때 세로 스크롤은 브라우저에 맡기고, 넘어가는 시간표가 옆 칸을 덮지 않게 자름 (테두리·그림자 여유 8px) */
section.day { touch-action: pan-y; overflow: clip; overflow-clip-margin: 8px; }
.day-pane { will-change: transform; }
.daybar { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 16px; }
.daybar h2 { margin: 0; font-size: 34px; line-height: 1; letter-spacing: -.045em; font-weight: 850; }
.daybar h2 small { display: block; font-size: 14px; letter-spacing: 0; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.daybar .spacer { flex: 1; }
.banner { display: flex; align-items: center; gap: 10px; padding: 13px 16px; margin-bottom: 18px; border-radius: 14px; font-weight: 700; font-size: 14px; border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); width: 100%; text-align: left; background: var(--warn-soft); color: var(--warn); }
.banner b { font-size: 18px; }
.banner .go { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; font-size: 13px; }

.periods { display: flex; flex-direction: column; gap: 8px; }
.ticket { display: grid; grid-template-columns: 58px 1fr; align-items: stretch; width: 100%; text-align: left; color: inherit; padding: 0; overflow: hidden;
  background: var(--k-bg); border: 1.5px solid var(--k-line); border-radius: 16px; }
.ticket.plan { border-style: dashed; }
.ticket .when { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-right: 1.5px solid var(--k-line); padding: 12px 0; }
.ticket.plan .when { border-right-style: dashed; }
.ticket .when b { font-size: 22px; font-weight: 850; line-height: 1; letter-spacing: -.03em; }
.ticket .when small { font-size: 11px; color: var(--muted); font-weight: 600; }
.ticket .body { min-width: 0; padding: 11px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.ticket .row1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ticket .name { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket .name.dim { color: var(--muted); font-weight: 600; font-size: 14px; }
.ticket .name small { font-weight: 500; color: var(--muted); font-size: 13px; }
.ticket.now { box-shadow: 0 0 0 3px var(--hl); border-color: transparent; }
.ticket.now .when b, .tl-col.today .tl-head .d { background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%); padding: 0 3px; }
.ticket.chg { border: 2px solid var(--red); }
.ticket.blocked { opacity: .75; }
.ticket.free { background: transparent; border: 1.5px dashed var(--rule); grid-template-columns: 58px 1fr; cursor: default; }
.ticket.free .when { border-right: 0; padding: 7px 0; }
.ticket.free .when b { font-size: 15px; color: var(--faint); }
.ticket.free .body { padding: 7px 14px; justify-content: center; font-size: 13px; color: var(--faint); }
.ticket.removed { background: var(--red-soft); border: 2px solid var(--red); cursor: default; }
.ticket.removed .when { border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.ticket.removed .name { color: var(--red); font-size: 14px; }
.status { margin-left: auto; font-size: 12.5px; font-weight: 750; display: inline-flex; align-items: center; gap: 4px; }
.status.todo { color: var(--warn); }
.status.done { color: var(--accent); }
.status.now { color: var(--hl-ink); background: var(--hl); padding: 1px 8px; border-radius: 99px; }
.status svg { width: 15px; height: 15px; }

.list { display: flex; flex-direction: column; }
.list > * { display: flex; align-items: center; gap: 9px; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--rule); background: none; width: 100%; text-align: left; font-size: 13.5px; min-width: 0; }
.list > *:last-child { border-bottom: 0; }
.list .when { width: 104px; flex: none; white-space: nowrap; color: var(--muted); font-weight: 650; }
.list s { color: var(--faint); }
.list .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .n { font-size: 12px; color: var(--muted); }
@media (hover: hover) and (pointer: fine) { button.list-row:hover { background: var(--sunk); } }
.minibar { width: 54px; height: 5px; border-radius: 3px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--rule); overflow: hidden; flex: none; }
.minibar i { display: block; height: 100%; background: var(--k-bar); }

/* 연간 진도표 */
.tl-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tl-bar h2 { margin: 0; font-size: 26px; letter-spacing: -.04em; font-weight: 850; }
.tl-bar .hint { font-size: 12.5px; color: var(--faint); }
.tl-bar .spacer { flex: 1; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--rule); border-radius: 11px; padding: 2px; }
.seg button { border: 0; background: none; min-height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(23,32,43,.08), 0 0 0 1px var(--rule); }
.seg .sw { width: 22px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, oklch(.68 .14 230), oklch(.68 .14 7), oklch(.68 .14 145), oklch(.68 .14 283)); }
.seg .sw.mono { background: linear-gradient(90deg, var(--ink), var(--rule-2)); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 0; padding: 0; background: none; border-radius: 8px; }
.chips button .chip { padding: 6px 12px; transition: background-color 150ms ease, color 150ms ease; }
.chips button.on .chip { background: var(--ink); color: var(--paper); box-shadow: none; }
.tl { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; position: relative; }
.tl-in { display: flex; width: max-content; }
.tl-col { flex: none; width: var(--colw); border-right: 1px solid var(--rule); }
.tl-col.mon { border-left: 1.5px solid var(--rule-2); }
.tl-col.today { background: color-mix(in srgb, var(--hl) 14%, transparent); }
.tl-col.collapsed { width: 34px; background: repeating-linear-gradient(-45deg, transparent 0 5px, var(--sunk) 5px 10px); }
.tl-head { height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 1px solid var(--rule); position: relative; }
.tl-head .m { position: absolute; top: 4px; left: 7px; font-size: 11px; font-weight: 800; color: var(--accent); }
.tl-head .d { font-size: 15px; font-weight: 800; }
.tl-head .w { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tl-side { position: sticky; left: 0; z-index: 5; width: 38px; background: var(--surface); border-right: 1px solid var(--rule); flex: none; }
.tl-side .tl-head { font-size: 11px; color: var(--faint); font-weight: 700; }
.tl-p { height: var(--rowh); display: grid; place-items: center; border-bottom: 1px solid var(--rule); font-weight: 800; color: var(--faint); font-size: 15px; }
.tl-p:last-child, .tl-cell:last-child { border-bottom: 0; }
.tl-cell { height: var(--rowh); border-bottom: 1px solid var(--rule); padding: 3px; }
.tl-cell > button, .tl-cell > div { width: 100%; height: 100%; border: 0; border-radius: 10px; padding: 5px 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; position: relative; overflow: hidden; }
.tl-cell .has { background: var(--k-bg); box-shadow: inset 0 0 0 1px var(--k-line); }
.tl-cell .has.plan { box-shadow: none; outline: 1.5px dashed var(--k-line); outline-offset: -1.5px; }
.tl-cell .r1 { display: flex; align-items: center; gap: 4px; width: 100%; }
.tl-cell .chip { font-size: 12px; min-width: 0; padding: 0 5px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--rule-2); }
.tl-cell .step { min-width: 18px; height: 18px; font-size: 11px; padding: 0 4px; border-radius: 9px; }
.tl-cell .t { font-size: 11px; line-height: 1.3; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
.tl-cell .plan .t { color: var(--muted); }
.tl-cell .t.todo { color: var(--warn); font-weight: 800; }
.tl-cell .t.ev { color: var(--event); font-weight: 700; }
.tl-cell .chg { box-shadow: inset 0 0 0 2px var(--red); outline: 0; }
.tl-cell .rib { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; font-size: 9.5px; font-weight: 800; padding: 1px 5px 2px 6px; border-bottom-left-radius: 7px; }
.tl-cell .gone { background: var(--red-soft); box-shadow: inset 0 0 0 1.5px var(--red); align-items: center; justify-content: center; }
.tl-cell .gone s { font-weight: 800; color: var(--red); font-size: 13px; text-decoration-thickness: 2px; }
.tl-cell .gone span { font-size: 10.5px; font-weight: 800; color: var(--red); }
.tl-cell .blocked { opacity: .55; }
.tl-cell .dim { opacity: .15; }
.tl-cell .ok { position: absolute; right: 5px; top: 5px; color: var(--k-bar); }
.tl-cell .ok svg { width: 14px; height: 14px; stroke-width: 3; }
.tl-v { writing-mode: vertical-rl; font-size: 12px; font-weight: 700; color: var(--event); padding: 10px 0; margin: 0 auto; letter-spacing: .05em; height: calc(var(--rowh) * 7); display: flex; align-items: center; justify-content: center; overflow: hidden; }

/* 학급 */

.bar > i { display: block; height: 100%; background: var(--k-bar); border-radius: 4px; }

.mini-list div { display: flex; gap: 8px; }

/* 설정 */
.settings { display: grid; gap: 14px; }
@media (min-width: 900px) { .settings { grid-template-columns: 1fr 1fr; align-items: start; } }
.panel.pad { padding: 18px; }
.panel h3 { margin: 0 0 4px; font-size: 16px; letter-spacing: -.02em; }
.panel p.desc { margin: 0 0 14px; font-size: 13px; color: var(--muted); max-width: 60ch; }
.panel textarea.plan-text { width: 100%; min-height: 280px; border: 1px solid var(--rule); background: var(--sunk); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.75; resize: vertical; }
.grade-tabs { margin-bottom: 10px; }
.code { display: flex; gap: 8px; }
.field { border: 1px solid var(--rule); background: var(--sunk); border-radius: 10px; padding: 8px 10px; font-size: 14px; min-width: 0; }
.code .field { flex: 1; font-family: ui-monospace, monospace; font-size: 12px; }
ol.steps { margin: 8px 0 0; padding-left: 20px; font-size: 13px; color: var(--muted); }
ol.steps li { margin: 4px 0; }
ol.steps code { background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 5px; font-size: 12px; color: var(--ink); }
.ev-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ev-form .wide { grid-column: 1 / -1; }
.ev-list { margin-top: 14px; display: flex; flex-direction: column; max-height: 270px; overflow-y: auto; border-top: 1px solid var(--rule); }
.ev-list .row { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--rule); font-size: 13px; }
.ev-list .row .d { width: 70px; color: var(--muted); flex: none; }
.ev-list .row .ti { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-list .row button { border: 0; background: none; color: var(--faint); padding: 9px; margin: -6px -4px; border-radius: 8px; }

/* 기록 시트 */
dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(100%, 470px); max-width: 100%; max-height: 92dvh; border-radius: 24px 24px 0 0; margin: auto auto 0; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
/* 열고 닫기·끌기는 스크립트의 스프링이 transform 과 --p(0~1, 펼쳐진 정도)를 움직임 */
dialog.sheet::backdrop { background: rgba(10, 16, 14, .42); opacity: var(--p, 1); }
@media (min-width: 600px) { dialog.sheet { border-radius: 24px; margin: auto; opacity: var(--p, 1); } }
@keyframes fade { from { opacity: 0; } }
.sheet-in { padding: 8px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.grab { touch-action: none; cursor: grab; display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
.grab:active { cursor: grabbing; }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--rule-2); align-self: center; }
.sheet-head { display: flex; align-items: center; gap: 11px; }

.plan-box .prev { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--k-line); }
.quick { display: grid; gap: 8px; }
.quick .btn { justify-content: flex-start; padding: 13px 15px; text-align: left; border-radius: 14px; }
.quick .btn small { margin-left: auto; font-weight: 500; opacity: .8; font-size: 12.5px; }
.manual { display: grid; gap: 8px; border-top: 1px dashed var(--rule-2); padding-top: 12px; }
.manual summary { font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.manual label { font-size: 12px; font-weight: 700; color: var(--faint); }
.manual select, .manual textarea { width: 100%; }
.manual .acts { display: flex; gap: 8px; }
.manual .acts .btn.primary { margin-left: auto; }
.queue-note { font-size: 12.5px; color: var(--warn); font-weight: 700; background: var(--warn-soft); padding: 7px 11px; border-radius: 10px; }

.empty { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 14px; }
.empty b { color: var(--ink); display: block; font-size: 16px; margin-bottom: 4px; }
.login { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.login .panel { padding: 36px 28px 30px; max-width: 380px; width: 100%; text-align: center; }
.login h1 { font-size: 26px; margin: 16px 0 8px; letter-spacing: -.04em; }
.login p { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
.login .mark { width: 56px; height: 56px; border-radius: 17px; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center; }
.login .mark svg { width: 30px; height: 30px; }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; z-index: 50; box-shadow: 0 8px 28px rgba(0,0,0,.22); white-space: nowrap; animation: toast-in 220ms var(--ease); }
@keyframes toast-in { from { transform: translate(-50%, 10px); opacity: 0; } }
.toast.out { transform: translate(-50%, 10px); opacity: 0; transition: transform 180ms var(--ease), opacity 180ms ease; }
@media (min-width: 900px) { .toast { bottom: 28px; } }
@media (prefers-reduced-motion: reduce) {
  dialog.sheet[open], .toast { animation: fade 150ms ease; }
  .btn:active, .icon-btn:active, .ticket:active, .tl-cell > button:active, .seg button:active, nav.tabs button:active, .chips button:active { transform: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { html, render, useState, useEffect, useMemo, useRef, useLayoutEffect } from "https://unpkg.com/htm@3.1.1/preact/standalone.module.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// 기존 앱과 같은 Firebase 프로젝트/경로 → 기존 로그인·학사일정(events) 그대로 사용
const fbApp = initializeApp({
  apiKey: "AIzaSyC74vmNOFabZ0qd2iPjDL7pWFg3W13h6rE",
  authDomain: "moon-pixel.firebaseapp.com",
  projectId: "moon-pixel",
  storageBucket: "moon-pixel.firebasestorage.app",
  messagingSenderId: "690517363714",
  appId: "1:690517363714:web:a5204517fcc83982942b1b",
});
const APP_ID = "godeok-ms-final-v3";
const auth = getAuth(fbApp);
const db = initializeFirestore(fbApp, { localCache: persistentLocalCache() });

// ponytail: 일반적인 중학교 종 시간(45분 수업·10분 휴식). 학교 시정과 다르면 여기만 고치면 됨.
const BELL = [null, ["09:00", "09:45"], ["09:55", "10:40"], ["10:50", "11:35"], ["11:45", "12:30"], ["13:20", "14:05"], ["14:15", "15:00"], ["15:10", "15:55"]];
const PERIODS = [1, 2, 3, 4, 5, 6, 7];
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const YEAR_END = "2027-02-26";
// 차시 색: 빨강·주황(시간표 변경·기록 필요 표시색)을 뺀 8색(88°~340°, 36° 간격).
// 1·2차시 차이가 가장 멀어지게 섞은 순서(전수 탐색 최적). 3차시 차이·8차시 차이는 색이 가까워서
// 밝기(--t)를 엇갈려 구분: 홀짝으로 바뀌고 8차시마다 한 번 더 뒤집힘
const HUE_ORDER = [0, 3, 6, 1, 4, 7, 2, 5];
const hue = step => 88 + HUE_ORDER[(step - 1) % 8] * 36;
const shade = step => (step + Math.floor((step - 1) / 8)) % 2;

// ---------- 날짜 ----------
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fromIso = s => new Date(s + "T00:00:00");
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); };
const isWeekend = s => [0, 6].includes(fromIso(s).getDay());
const md = s => { const d = fromIso(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const mdw = s => `${md(s)}(${WD[fromIso(s).getDay()]})`;
const atTime = (s, hhmm) => new Date(`${s}T${hhmm}:00`);
const gradeOf = c => +c.split("-")[0];
const slotKey = (date, p) => `${date}_${p}`;
const nextSchoolDay = (s, dir = 1) => { let d = addDays(s, dir); while (isWeekend(d)) d = addDays(d, dir); return d; };

// 학사일정(기존 앱 규칙 그대로): 제목 괄호의 'n학년' → 대상 학년, 없으면 전 학년
const targetGrades = title => {
  const m = title?.match(/\(([^)]*?)\s*학년/);
  if (!m) return [1, 2, 3];
  const r = m[1].match(/([1-3])\s*[-~∼–—]\s*([1-3])/);
  if (r) { const a = []; for (let g = Math.min(+r[1], +r[2]); g <= Math.max(+r[1], +r[2]); g++) a.push(g); return a; }
  const gs = [...new Set((m[1].match(/[1-3]/g) || []).map(Number))];
  return gs.length ? gs : [1, 2, 3];
};
const isExam = e => e.type === "시험" || e.title?.includes("고사");
const blocks = e => !e.title?.includes("창체") && (e.type === "시험" || e.type === "휴업" || e.type === "행사(수업제외)");
const allDay = e => !e.period || e.period === "전교시";

// ---------- 데이터 ----------
function useUserData(user) {
  const [data, setData] = useState({ meta: {}, lessons: {}, events: [], ready: false });
  useEffect(() => {
    if (!user) return;
    const base = ["artifacts", APP_ID, "users", user.uid];
    let got = 0;
    const done = () => { if (++got >= 3) setData(d => ({ ...d, ready: true })); };
    const subs = [
      onSnapshot(collection(db, ...base, "meta"), s => { const m = {}; s.forEach(x => m[x.id] = x.data()); setData(d => ({ ...d, meta: m })); done(); }, done),
      onSnapshot(collection(db, ...base, "lessons"), s => { const m = {}; s.forEach(x => m[x.id] = x.data()); setData(d => ({ ...d, lessons: m })); done(); }, done),
      onSnapshot(collection(db, ...base, "events"), s => { setData(d => ({ ...d, events: s.docs.map(x => ({ id: x.id, ...x.data() })) })); done(); }, done),
    ];
    return () => subs.forEach(u => u());
  }, [user]);
  return data;
}
const ref = (user, col, id) => doc(db, "artifacts", APP_ID, "users", user.uid, col, id);

// 시간표·진도 계산을 한곳에
function useModel({ meta, lessons, events }) {
  return useMemo(() => {
    let tt = null;
    try { tt = meta.timetable?.json ? JSON.parse(meta.timetable.json) : null; } catch { }
    const syncedAt = meta.timetable?.syncedAt?.toDate?.() || null;
    const plans = meta.plans || {};
    const notes = meta.notes || {};
    const tinted = meta.prefs?.colorMode !== "mono";

    const classes = [...new Set(Object.values(tt?.base || {}).flatMap(d => Object.values(d).map(x => x.c)))]
      .sort((a, b) => gradeOf(a) - gradeOf(b) || +a.split("-")[1] - +b.split("-")[1]);
    const firstDay = Object.keys(tt?.days || {}).sort()[0];

    const eventsByDate = {};
    for (const e of events) (eventsByDate[e.date] ||= []).push(e);
    const blockingEvent = (date, p, grade) => (eventsByDate[date] || []).find(e => blocks(e) && (allDay(e) || e.period === `${p}교시`) && targetGrades(e.title).includes(grade));
    const grades = [...new Set(classes.map(gradeOf))];
    // 내 모든 학년이 하루 종일 수업이 없는 날(방학·휴업·시험) → 연간표에서 접어서 표시
    const dayOff = date => {
      const e = (eventsByDate[date] || []).find(e => blocks(e) && allDay(e) && grades.every(g => targetGrades(e.title).includes(g)));
      if (e) return e;
      const wd = fromIso(date).getDay(), live = tt?.days[date];
      // 컴시간에서 그날 내 수업이 전부 빠짐(시험·출장 등)
      if (live && !Object.keys(live).length && Object.keys(tt.base[wd] || {}).length) return { title: "수업 없음 (컴시간)" };
    };

    // 그날의 교시별 수업. 알림이 주간 데이터가 있으면 그것(변경 반영), 없으면 기본 시간표.
    const slotsFor = date => {
      const wd = fromIso(date).getDay();
      if (!tt || wd === 0 || wd === 6) return [];
      const base = tt.base[wd] || {};
      const live = tt.days[date];
      const day = live || base;
      const slots = PERIODS.map(p => {
        const cur = day[p], orig = base[p];
        const c = cur?.c || null, oc = orig?.c || null;
        return {
          date, p, c, s: cur?.s,
          changed: !!live && !!c && c !== oc,   // 이 시간에 다른 반(또는 원래 없던 수업)이 들어옴
          was: !!live && c !== oc ? oc : null,   // 원래 있던 반
          removed: !!live && !c && oc ? oc : null, // 원래 있던 수업이 빠짐
          event: c ? blockingEvent(date, p, gradeOf(c)) : null,
        };
      });
      // 같은 날 빠진 반이 다른 교시에 들어왔으면 '이동'으로 짝지음
      for (const r of slots.filter(s => s.removed)) {
        const a = slots.find(s => s.changed && s.c === r.removed && !s.from);
        if (a) { a.from = r.p; r.to = a.p; }
      }
      return slots;
    };

    // 수업 기록: lessons/{date_p} = { date, p, c, step, note, skip }
    const byClass = {};
    for (const [k, l] of Object.entries(lessons)) (byClass[l.c] ||= []).push({ ...l, k });
    for (const c in byClass) byClass[c].sort((a, b) => a.k < b.k ? -1 : 1);
    const stepBefore = (c, k) => { let s = 0; for (const l of byClass[c] || []) { if (l.k >= k) break; if (l.step) s = Math.max(s, l.step); } return s; };
    const progress = c => Math.max(0, ...(byClass[c] || []).map(l => l.step || 0));
    const lastLesson = c => [...(byClass[c] || [])].reverse().find(l => !l.skip);
    const planOf = c => plans[gradeOf(c)] || [];
    const planName = (c, step) => planOf(c)[step - 1] || `${step}차시`;
    const stepTitle = (c, step) => step ? `${step}. ${planOf(c)[step - 1] || `${step}차시`}` : "";
    const firstLesson = Object.keys(lessons).sort()[0]?.slice(0, 10);

    // 칸마다 차시: 기록한 수업은 기록 그대로, 아직인 수업은 앞 기록 +1, +2 … 로 이어서 예상
    // (기록을 쓰기 시작한 날 전, 학사일정으로 빠진 수업은 차시 없음. 차시 계획을 넘어가면 -1 = 계획 끝)
    const stepOf = {};
    const startFrom = firstLesson || iso(new Date());
    const run = {};
    for (let d = firstDay; d && d <= YEAR_END; d = addDays(d, 1)) for (const s of slotsFor(d)) {
      if (!s.c) continue;
      const k = slotKey(d, s.p), l = lessons[k];
      if (l) { stepOf[k] = l.skip ? 0 : l.step || 0; continue; }
      if (s.event || d < startFrom) continue;
      const b = stepBefore(s.c, k);
      const r = run[s.c]?.[0] === b ? run[s.c] : (run[s.c] = [b, 0]);
      const n = b + ++r[1], last = planOf(s.c).length;
      stepOf[k] = last && n > last ? -1 : n;
    }

    const nextExam = (grade, from) => events.filter(e => isExam(e) && e.date >= from && targetGrades(e.title).includes(grade)).sort((a, b) => a.date < b.date ? -1 : 1)[0];
    const lessonsUntil = (c, from, until) => {
      let n = 0;
      for (let d = from; d < until; d = addDays(d, 1)) n += slotsFor(d).filter(s => s.c === c && !s.event).length;
      return n;
    };

    // 끝났는데 기록 안 한 수업: 처음 기록을 남긴 날 이후, 최근 2주까지만 (쓰기 전 수업까지 밀린 걸로 치지 않음)
    const pending = now => {
      const today = iso(now), out = [];
      const start = [addDays(today, -14), firstLesson || today].sort()[1];
      for (let d = start; d <= today; d = addDays(d, 1))
        for (const s of slotsFor(d))
          if (s.c && !s.event && !lessons[slotKey(d, s.p)] && atTime(d, BELL[s.p][1]) <= now) out.push(s);
      return out;
    };

    // 오늘부터 n일 안의 시간표 변경 (컴시간 알리미처럼 한눈에)
    const changesFrom = (from, n) => {
      const out = [];
      for (let d = from, i = 0; i < n; d = addDays(d, 1), i++)
        if (dayOff(d)?.title === "수업 없음 (컴시간)") out.push({ date: d, p: 0, allOff: true });
        else for (const s of slotsFor(d)) if (s.changed || s.removed) out.push(s);
      return out;
    };

    return { tt, syncedAt, plans, notes, tinted, classes, firstDay, slotsFor, dayOff, byClass, stepBefore, stepOf, progress, lastLesson, planOf, planName, stepTitle, nextExam, lessonsUntil, pending, changesFrom, lessons, events };
  }, [meta, lessons, events]);
}

// ---------- 움직임 (Apple 'Designing Fluid Interfaces' 방식) ----------
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
// 임계 감쇠 스프링(damping 1.0, 튕김 없음)의 정확한 해. 지금 값·속도에서 출발하므로 도중에 잡거나 방향을 바꿔도 끊김 없음
function spring(from, to, v0, response, onFrame, onDone) {
  if (reduceMotion()) { onFrame(to); onDone?.(); return () => { }; }
  const w = 2 * Math.PI / response, x0 = from - to, t0 = performance.now();
  let id;
  // 시각은 직접 잼: rAF 가 넘겨주는 시각은 기준이 달라 t 가 음수가 되는 브라우저가 있음
  const step = () => {
    const t = Math.max(0, performance.now() - t0) / 1000, e = Math.exp(-w * t);
    const x = (x0 + (v0 + w * x0) * t) * e, v = (v0 - w * t * (v0 + w * x0)) * e;
    if (Math.abs(x) < 0.5 && Math.abs(v) < 20) { onFrame(to); onDone?.(); return; }
    onFrame(to + x);
    id = requestAnimationFrame(step);
  };
  id = requestAnimationFrame(step);
  return () => cancelAnimationFrame(id);
}
// 손을 뗀 속도로 어디까지 미끄러질지 (스크롤 감속과 같은 식)
const project = (v, rate = 0.998) => v / 1000 * rate / (1 - rate);
// 경계 너머로 끌면 점점 덜 따라옴
const rubber = (d, dim, c = 0.55) => d * dim * c / (dim + c * Math.abs(d));
// 최근 80ms 포인터 기록 → 속도(px/s)
const track = (hist, v, t) => { hist.push({ v, t }); while (hist.length > 2 && t - hist[0].t > 80) hist.shift(); };
const velocity = hist => { const a = hist[0], b = hist[hist.length - 1]; return a && b && b.t > a.t ? (b.v - a.v) / (b.t - a.t) * 1000 : 0; };

const Icon = ({ n }) => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${ICONS[n]} /></svg>`;
const chgLabel = s => s.from ? `${s.from}→${s.p}교시 이동` : s.was ? `${s.was} → ${s.c}` : "추가";
const Chip = ({ c, lg, solid, gone }) => html`<span class=${"chip" + (lg ? " lg" : "") + (solid ? " solid" : "") + (gone ? " gone" : "")}>${c}</span>`;
// 차시 색 입히기: k(무채색 바탕) + tint(차시 색) + plan(아직 안 한 수업 = 점선·연하게)
const kc = (m, step, planned) => `k${step && m.tinted ? " tint" : ""}${planned ? " plan" : ""}`;
const kh = step => step ? `--h:${hue(step)};--t:${shade(step)}` : "";
const Step = ({ n, lg }) => n ? html`<span class=${"step" + (lg ? " lg" : "")} title=${`${n}차시`}>${n}</span>` : null;

function App() {
  const [user, setUser] = useState(undefined);
  useEffect(() => onAuthStateChanged(auth, setUser), []);
  if (user === undefined) return null;
  if (!user) return html`<${Login} />`;
  return html`<${Main} user=${user} />`;
}

function Login() {
  const [err, setErr] = useState("");
  const go = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => setErr(e.message));
  return html`<div class="login"><div class="panel">
    <div class="mark"><${Icon} n="book" /></div>
    <h1>고덕중 진도표</h1>
    <p>컴시간 시간표가 자동으로 들어오고,<br />수업이 끝나면 한 번 눌러 진도를 남겨요.</p>
    <button class="btn primary" style="width:100%;padding:13px" onClick=${go}>Google 계정으로 시작</button>
    ${err && html`<p style="color:var(--red);margin:12px 0 0;font-size:13px">${err}</p>`}
  </div></div>`;
}

function Main({ user }) {
  const data = useUserData(user);
  const m = useModel(data);
  const [tab, setTab] = useState(() => { try { return localStorage.getItem("tab") || "today"; } catch { return "today"; } });
  const [now, setNow] = useState(new Date());
  const [sheet, setSheet] = useState(null); // { slot, queue }
  const [toast, setToast] = useState("");
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(t); }, []);
  useEffect(() => { try { localStorage.setItem("tab", tab); } catch { } }, [tab]);
  // 알림은 아래에서 올라와서, 사라질 때도 아래로 내려감
  const [toastOut, setToastOut] = useState(false);
  useEffect(() => {
    if (!toast) return;
    setToastOut(false);
    const a = setTimeout(() => setToastOut(true), 2000), b = setTimeout(() => setToast(""), 2200);
    return () => { clearTimeout(a); clearTimeout(b); };
  }, [toast]);

  const pending = m.tt ? m.pending(now) : [];
  const open = (slot, queue = false) => setSheet({ slot, queue });

  const saveLesson = async (slot, rec) => {
    const k = slotKey(slot.date, slot.p);
    if (rec === null) await deleteDoc(ref(user, "lessons", k));
    else await setDoc(ref(user, "lessons", k), { date: slot.date, p: slot.p, c: slot.c, step: rec.step || 0, note: rec.note || "", skip: !!rec.skip, at: Date.now() });
    // 밀린 기록 모드면 다음 밀린 수업을 바로 띄움
    const next = sheet?.queue && rec !== null && pending.find(s => slotKey(s.date, s.p) !== k);
    setSheet(next ? { slot: next, queue: true } : null);
    setToast(rec === null ? "기록을 지웠어요" : next ? `${slot.c} 기록함 · 다음 밀린 수업` : `${slot.c} 기록함`);
  };
  const saveMeta = (id, val) => setDoc(ref(user, "meta", id), val, { merge: true });

  const stale = m.syncedAt && (now - m.syncedAt) > 3 * 86400000;
  const tabs = [["today", "오늘", "today"], ["year", "진도표", "year"], ["classes", "학급", "classes"], ["settings", "설정", "settings"]];
  const ctx = { m, now, open, user, saveMeta, setToast, setTab, pending };

  return html`<div class="app">
    <header class="top">
      <div class="brand"><div class="mark"><${Icon} n="book" /></div>
        <div style="min-width:0"><b>진도표</b><small>${m.tt ? `${m.tt.teacher} 선생님, ${m.tt.subject}` : "고덕중학교"}</small></div></div>
      <div class="sync" title=${m.syncedAt ? `마지막 동기화 ${m.syncedAt.toLocaleString("ko-KR")}` : ""}>
        ${m.tt ? html`<i class=${stale ? "old" : ""}></i><span>컴시간 ${m.tt.savedAt.slice(5, 16).replace("-", "/")}</span>` : html`<i class="old"></i>시간표 연동 전`}
      </div>
      <nav class="tabs">${tabs.map(([k, label, ic]) => html`<button class=${tab === k ? "on" : ""} aria-current=${tab === k ? "page" : null} onClick=${() => setTab(k)}><${Icon} n=${ic} />${label}${k === "today" && pending.length > 0 && html`<span class="badge">${pending.length}</span>`}</button>`)}</nav>
    </header>
    ${!data.ready ? html`<div class="empty">불러오는 중…</div>`
      : !m.tt && tab !== "settings" ? html`<div class="panel empty"><b>아직 시간표가 없어요</b>설정 탭의 'PC 연동' 안내대로 알림이 PC에서 한 번만 연결하면 자동으로 들어옵니다.<br /><br /><button class="btn primary" onClick=${() => setTab("settings")}>연동하러 가기</button></div>`
      : tab === "today" ? html`<${Today} ...${ctx} />`
      : tab === "year" ? html`<${Year} ...${ctx} />`
      : tab === "classes" ? html`<${Classes} ...${ctx} />`
      : html`<${Settings} ...${ctx} />`}
    ${sheet && html`<${RecordSheet} key=${slotKey(sheet.slot.date, sheet.slot.p)} slot=${sheet.slot} queue=${sheet.queue ? pending.length : 0} m=${m} onSave=${saveLesson} onClose=${() => setSheet(null)} />`}
    ${toast && html`<div class=${"toast" + (toastOut ? " out" : "")} role="status">${toast}</div>`}
  </div>`;
}

// 교시 상태: done / todo(끝났는데 기록 없음) / now / later / blocked
function slotState(m, s, now) {
  if (s.event) return "blocked";
  if (m.lessons[slotKey(s.date, s.p)]) return "done";
  if (atTime(s.date, BELL[s.p][1]) <= now) return "todo";
  if (atTime(s.date, BELL[s.p][0]) <= now) return "now";
  return "later";
}
// 칸에 보일 차시 번호와 이름
function slotInfo(m, s) {
  const l = m.lessons[slotKey(s.date, s.p)];
  const v = m.stepOf[slotKey(s.date, s.p)] || 0, step = Math.max(0, v), over = v < 0;
  return { l, step, over, planned: !l, name: l?.skip ? "수업 못함" : step ? m.planName(s.c, step) : over ? "계획 끝" : "", note: l?.note || "" };
}

function Today({ m, now, open, setTab, pending }) {
  const todayIso = iso(now);
  const [date, setDate] = useState(isWeekend(todayIso) ? nextSchoolDay(todayIso) : todayIso);
  const slots = m.slotsFor(date);
  const lastP = Math.max(0, ...slots.filter(s => s.c || s.removed).map(s => s.p));
  const isToday = date === todayIso;
  const changes = m.changesFrom(todayIso, 14);

  // 날짜 넘기기: 시간표가 손가락을 1:1로 따라오고, 놓으면 그 속도 그대로 다음 날로 넘어가거나 제자리로 돌아옴.
  // 화살표 버튼도 같은 길(밀려 나가고 반대편에서 들어옴)로 움직임
  const pane = useRef(), x = useRef(0), stopX = useRef(null), swipe = useRef(null);
  const setX = v => { x.current = v; if (pane.current) pane.current.style.transform = v ? `translateX(${v}px)` : ""; };
  useEffect(() => () => stopX.current?.(), []);
  const go = (dir, v0 = 0) => {
    stopX.current?.();
    const w = (pane.current?.offsetWidth || 400) + 24;
    stopX.current = spring(x.current, -dir * w, v0, 0.22, setX, () => {
      setDate(d => nextSchoolDay(d, dir));
      setX(dir * w);
      stopX.current = spring(dir * w, 0, v0, 0.34, setX);
    });
  };
  const sw = {
    onPointerDown: e => {
      if (e.pointerType === "mouse") return; // 마우스는 화살표 버튼으로
      swipe.current = { x0: e.clientX, y0: e.clientY, on: false, hist: [] };
    },
    onPointerMove: e => {
      const g = swipe.current;
      if (!g) return;
      if (!g.on) {
        const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
        if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swipe.current = null; return; } // 세로 스크롤에 양보
        if (Math.abs(dx) < 10) return;
        // 10px 넘게 옆으로 움직였을 때부터 잡음 (그 자리 기준이라 튀지 않음)
        stopX.current?.();
        Object.assign(g, { on: true, x0: e.clientX - x.current });
        e.currentTarget.setPointerCapture(e.pointerId);
      }
      setX(e.clientX - g.x0);
      track(g.hist, x.current, e.timeStamp);
    },
    onPointerUp: e => {
      const g = swipe.current;
      swipe.current = null;
      if (!g?.on) return;
      track(g.hist, x.current, e.timeStamp);
      const v = velocity(g.hist), end = x.current + project(v, 0.99);
      if (Math.abs(end) > pane.current.offsetWidth * 0.35) go(end < 0 ? 1 : -1, v);
      else stopX.current = spring(x.current, 0, v, 0.3, setX);
    },
  };
  sw.onPointerCancel = sw.onPointerUp;

  return html`<div class="today-layout">
    <section class="day" ...${sw}>
      ${pending.length > 0 && html`<button class="banner" onClick=${() => open(pending[0], true)}>
        <${Icon} n="alert" /><span>기록 안 한 수업 <b>${pending.length}</b>개</span><span class="go">차례로 기록하기<${Icon} n="right" /></span></button>`}
      <div class="daybar">
        <h2><small>${isToday ? mdw(date) : WD[fromIso(date).getDay()] + "요일"}</small>${isToday ? "오늘" : md(date)}</h2>
        <div class="spacer"></div>
        ${!isToday && html`<button class="btn sm" onClick=${() => setDate(todayIso)}>오늘로</button>`}
        <button class="icon-btn" aria-label="이전 날" onClick=${() => go(-1)}><${Icon} n="left" /></button>
        <button class="icon-btn" aria-label="다음 날" onClick=${() => go(1)}><${Icon} n="right" /></button>
      </div>
      <div class="day-pane" ref=${pane}>
      ${m.dayOff(date) ? html`<div class="panel empty"><b>${m.dayOff(date).title}</b>학사일정상 수업이 없는 날이에요.</div>`
        : lastP === 0 ? html`<div class="panel empty"><b>수업 없는 날</b></div>`
        : html`<div class="periods">${slots.filter(s => s.p <= lastP).map(s => {
          const when = html`<div class="when"><b>${s.p}</b><small>${BELL[s.p][0]}</small></div>`;
          if (!s.c && s.removed) return html`<div class="ticket removed">${when}
            <div class="body"><div class="row1"><${Chip} c=${s.removed} gone /><span class="tag chg">${s.to ? `${s.to}교시로 이동` : "빠짐"}</span></div>
            <div class="name">${s.to ? `이 수업은 ${s.to}교시로 옮겨졌어요` : "컴시간에서 이 수업이 빠졌어요"}</div></div></div>`;
          if (!s.c) return html`<div class="ticket free"><div class="when"><b>${s.p}</b></div><div class="body">공강</div></div>`;
          const st = slotState(m, s, now), i = slotInfo(m, s);
          return html`<button class=${`ticket ${kc(m, i.step, i.planned)} ${i.over ? "over" : ""} ${st} ${s.changed ? "chg" : ""}`} style=${kh(i.step)} onClick=${() => open(s)}>
            ${when}
            <div class="body">
              <div class="row1"><${Chip} c=${s.c} /><${Step} n=${i.step} />
                ${s.changed && html`<span class="tag chg"><${Icon} n="swap" />${chgLabel(s)}</span>`}
                ${s.event && html`<span class="tag event">${s.event.title}</span>`}
                ${st === "done" && html`<span class="status done"><${Icon} n="check" />기록함</span>`}
                ${st === "todo" && html`<span class="status todo"><${Icon} n="pen" />기록하기</span>`}
                ${st === "now" && html`<span class="status now">수업 중</span>`}
              </div>
              ${s.event ? html`<div class="name dim">학사일정으로 수업 없음</div>`
                : i.over ? html`<div class="name dim">차시 계획 끝. 설정에서 다음 차시를 적어 주세요</div>`
                : i.name ? html`<div class="name">${i.name}${i.note && html`<small> · ${i.note}</small>`}</div>`
                : html`<div class="name dim">차시 기록 전</div>`}
            </div>
          </button>`;
        })}</div>`}
      </div>
    </section>
    <section>
      <div class="h-row"><h3>시간표 변경</h3><span class=${"count" + (changes.length ? " red" : "")}>${changes.length}</span><span class="sub">앞으로 2주</span></div>
      ${changes.length === 0 ? html`<div class="panel empty" style="padding:18px">바뀐 시간표가 없어요</div>`
        : html`<div class="panel list">${changes.map(s => html`<button class="list-row" onClick=${() => setDate(s.date)}>
          <span class="when">${mdw(s.date)} ${s.p ? `${s.p}교시` : ""}</span>
          ${s.allOff ? html`<span class="tag chg">하루 수업 전부 빠짐</span>` : s.removed ? html`<${Chip} c=${s.removed} gone /><span class="tag chg">${s.to ? `${s.to}교시로 이동` : "빠짐"}</span>`
            : s.was ? html`<s>${s.was}</s><${Icon} n="right" /><${Chip} c=${s.c} />${s.from && html`<span class="tag chg">${s.from}교시에서</span>`}`
            : html`<${Chip} c=${s.c} /><span class="tag chg">${s.from ? `${s.from}교시에서 이동` : "추가"}</span>`}
        </button>`)}</div>`}
      <div class="h-row"><h3>학급별 진도</h3><button class="btn sm ghost" onClick=${() => setTab("classes")}>자세히</button></div>
      <div class="panel list">${m.classes.map(c => {
        const total = m.planOf(c).length, p = m.progress(c);
        return html`<div class=${kc(m, p)} style=${kh(p)}><${Chip} c=${c} /><${Step} n=${p} />
          <div class="t">${p ? m.planName(c, p) : html`<span style="color:var(--faint)">아직 기록 없음</span>`}</div>
          ${total > 0 && html`<div class="minibar"><i style=${`width:${Math.min(100, p / total * 100)}%`}></i></div><span class="n">${p}/${total}</span>`}</div>`;
      })}</div>
    </section>
  </div>`;
}

// 연간 진도표: 학기 전체를 가로로. 마우스 휠(위/아래)로 좌우 이동, 모바일은 손가락으로 밀기.
function Year({ m, now, open, saveMeta }) {
  const todayIso = iso(now);
  const scroller = useRef();
  const [only, setOnly] = useState(null); // 특정 반만 강조
  const days = useMemo(() => {
    const out = [];
    for (let d = m.firstDay || todayIso; d <= YEAR_END; d = addDays(d, 1)) if (!isWeekend(d)) out.push(d);
    return out;
  }, [m.firstDay]);
  const narrow = typeof innerWidth !== "undefined" && innerWidth < 600;
  const colw = narrow ? 96 : 128, rowh = narrow ? 64 : 72;

  const centerOn = (date, smooth) => {
    const el = scroller.current?.querySelector(`[data-d="${date}"]`) || scroller.current?.querySelector(`[data-d^="${date.slice(0, 7)}"]`);
    if (el) scroller.current.scrollTo({ left: el.offsetLeft - scroller.current.clientWidth / 2 + el.offsetWidth / 2, behavior: smooth ? "smooth" : "auto" });
  };
  useLayoutEffect(() => { centerOn(isWeekend(todayIso) ? nextSchoolDay(todayIso) : todayIso, false); }, []);
  useEffect(() => {
    const el = scroller.current;
    const onWheel = e => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || e.shiftKey) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY * 1.6; // 아래로 굴리면 미래, 위로 굴리면 과거
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, []);
  const page = dir => scroller.current.scrollBy({ left: dir * colw * 5, behavior: "smooth" });

  return html`<div>
    <div class="tl-bar">
      <h2>진도표</h2><span class="hint">${narrow ? "옆으로 밀어서 이동" : "마우스 휠로 좌우 이동"}</span>
      <div class="spacer"></div>

function renderCell(m, s, now, open, only) {
  if (!s.c && s.removed) return html`<div class=${"gone" + (only && only !== s.removed ? " dim" : "")}><s>${s.removed}</s><span>${s.to ? `→${s.to}교시` : "빠짐"}</span></div>`;
  if (!s.c) return null;
  const st = slotState(m, s, now), i = slotInfo(m, s);
  const cls = `has ${kc(m, i.step, i.planned)} ${i.over ? "over" : ""} ${s.changed ? "chg" : ""} ${st === "blocked" ? "blocked" : ""} ${only && only !== s.c ? "dim" : ""}`;
  return html`<button class=${cls} style=${kh(i.step)} onClick=${() => open(s)} title=${[s.changed && chgLabel(s), i.step && m.stepTitle(s.c, i.step)].filter(Boolean).join("\n")}>
    ${s.changed && html`<span class="rib">${s.from ? `${s.from}→${s.p}` : s.was ? "변경" : "추가"}</span>`}
    <span class="r1"><${Chip} c=${s.c} />${st !== "blocked" && html`<${Step} n=${i.step} />`}</span>
    <span class=${"t " + (st === "todo" ? "todo" : st === "blocked" ? "ev" : "")}>
      ${st === "blocked" ? s.event.title : st === "todo" ? "기록 필요" : i.name}
    </span>
    ${st === "done" && !s.changed && html`<span class="ok"><${Icon} n="check" /></span>`}
  </button>`;
}

function RecordSheet({ slot, queue, m, onSave, onClose }) {
  const dlg = useRef(), y = useRef(0), dist = useRef(1), stop = useRef(null), drag = useRef(null);
  // y = 아래로 내려간 거리. --p(0~1)로 뒷배경 어둡기·데스크톱 투명도를 같이 움직임
  const setY = v => {
    y.current = v;
    const d = dlg.current;
    if (!d) return;
    d.style.transform = v ? `translateY(${v}px)` : "";
    d.style.setProperty("--p", Math.max(0, Math.min(1, 1 - v / dist.current)).toFixed(3));
  };
  // 화면 아래에서 올라오고, 닫을 때는 같은 길로 내려감
  useLayoutEffect(() => {
    dlg.current.showModal();
    dist.current = innerHeight - dlg.current.getBoundingClientRect().top;
    setY(dist.current);
    stop.current = spring(dist.current, 0, 0, 0.36, setY);
    return () => stop.current?.();
  }, []);
  const exit = (v0 = 0, then) => {
    stop.current?.();
    stop.current = spring(y.current, dist.current, Math.max(0, v0), 0.3, setY, () => { dlg.current?.close(); then?.(); });
  };
  const save = rec => exit(0, () => onSave(slot, rec));
  // 머리 부분을 잡고 끌어내리기: 손가락 1:1, 위로는 고무줄, 놓을 때 속도로 닫을지 결정
  const grab = {
    onPointerDown: e => {
      if (e.button > 0 || e.target.closest("button")) return;
      stop.current?.();
      e.currentTarget.setPointerCapture(e.pointerId);
      drag.current = { y0: e.clientY - y.current, hist: [] };
    },
    onPointerMove: e => {
      const g = drag.current;
      if (!g) return;
      const v = e.clientY - g.y0;
      setY(v < 0 ? rubber(v, dist.current) : v);
      track(g.hist, y.current, e.timeStamp);
    },
    onPointerUp: e => {
      const g = drag.current;
      if (!g) return;
      drag.current = null;
      track(g.hist, y.current, e.timeStamp); // 멈췄다 놓으면 속도 0
      const v = velocity(g.hist);
      if (y.current + project(v) > dist.current * 0.4) exit(v);
      else stop.current = spring(y.current, 0, v, 0.32, setY);
    },
  };
  grab.onPointerCancel = grab.onPointerUp;
  const k = slotKey(slot.date, slot.p);
  const existing = m.lessons[k];
  const prev = m.stepBefore(slot.c, k);
  const plan = m.planOf(slot.c);
  const [step, setStep] = useState(existing ? existing.step || prev + 1 : prev + 1);
  const [note, setNote] = useState(existing?.note || "");
  const maxStep = Math.max(plan.length, prev + 1, step) + 3;
  const shown = existing ? (existing.skip ? 0 : existing.step) : prev + 1;

  return html`<dialog class="sheet" ref=${dlg} onClose=${onClose} onCancel=${e => { e.preventDefault(); exit(); }} onClick=${e => e.target === dlg.current && exit()}>
    <div class="sheet-in">
      <div class="grab" ...${grab}><div class="grabber"></div>
      <div class="sheet-head"><${Chip} c=${slot.c} lg solid />
        <div><div style="font-weight:800">${mdw(slot.date)} ${slot.p}교시</div>
          <div class="meta">${slot.s}${slot.changed ? html`, <span style="color:var(--red);font-weight:800">${slot.from ? `${slot.from}교시에서 옮겨온 수업` : slot.was ? `시간표 변경 (원래 ${slot.was})` : "추가된 수업"}</span>` : ""}</div></div>
        <button class="icon-btn x" aria-label="닫기" onClick=${() => exit()}><${Icon} n="x" /></button>
      </div></div>
      ${queue > 0 && html`<div class="queue-note">밀린 기록 ${queue}개 남음. 저장하면 다음 수업이 바로 열려요</div>`}
      ${slot.event && html`<div class="tag event" style="align-self:flex-start;font-size:13px;padding:5px 10px">${slot.event.title}: 학사일정상 수업 없음</div>`}
      <div class=${"plan-box " + kc(m, shown, !existing)} style=${kh(shown)}>
        <${Step} n=${shown} lg />
        <div class="lbl">${existing ? "기록된 진도" : "이번 시간 계획"}</div>
        <div class="val">${existing?.skip ? "수업 못함" : m.planName(slot.c, shown)}</div>
        <div class="prev">지난 시간: ${prev ? m.stepTitle(slot.c, prev) : "기록 없음"}</div>
      </div>
      <div class="quick">
        <button class="btn primary" onClick=${() => save({ step: prev + 1, note })}><${Icon} n="check" />계획대로 했어요<small>${prev + 1}차시</small></button>
        ${prev > 0 && html`<button class="btn" onClick=${() => save({ step: prev, note })}>진도 못 나감, 이어서 했어요<small>${prev}차시 계속</small></button>`}
        <button class="btn" onClick=${() => save({ skip: true, step: 0, note })}>수업 못함<small>행사·자습 등</small></button>
      </div>
      <details class="manual" open=${!!existing}>
        <summary>차시 직접 고르기, 메모</summary>
        <label for="step">차시</label>
        <select id="step" class="field" value=${step} onChange=${e => setStep(+e.target.value)}>
          ${Array.from({ length: maxStep }, (_, i) => i + 1).map(n => html`<option value=${n}>${m.stepTitle(slot.c, n)}</option>`)}
        </select>
        <label for="note">메모</label>
        <textarea id="note" class="field" rows="2" placeholder="예: 실험 못 끝냄, 다음 시간 마무리" value=${note} onInput=${e => setNote(e.target.value)}></textarea>
        <div class="acts">
          ${existing && html`<button class="btn ghost" style="color:var(--red)" onClick=${() => save(null)}>기록 지우기</button>`}
          <button class="btn primary" onClick=${() => save({ step, note })}>저장</button>
        </div>
      </details>
    </div>
  </dialog>`;
}

// 학사일정: 직접 추가/삭제 + 엑셀(월별 달력 시트) 일괄 업로드 — 파서는 기존 앱 그대로
function EventsPanel({ m, user, setToast }) {
  const input = useRef();
  const col = () => collection(db, "artifacts", APP_ID, "users", user.uid, "events");
  const [f, setF] = useState({ date: iso(new Date()), type: "행사(수업제외)", title: "", period: "전교시" });
  const add = async () => {
    if (!f.title.trim()) return setToast("일정 이름을 적어 주세요");
    await setDoc(doc(col(), `m-${Date.now()}`), { ...f, title: f.title.trim() });
    setF({ ...f, title: "" });
    setToast("일정을 추가했어요");
  };
  const upcoming = m.events.filter(e => e.date >= iso(new Date())).sort((a, b) => a.date < b.date ? -1 : 1);

  const loadXlsx = () => window.XLSX ? Promise.resolve() : new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = "https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js";
    s.onload = ok; s.onerror = no; document.head.appendChild(s);
  });
  const upload = async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      await loadXlsx();
      const wb = XLSX.read(await file.arrayBuffer());
      const list = [];
      for (const name of wb.SheetNames) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1 });
        let ym = null;
        for (const row of rows.slice(0, 15)) for (const cell of row || []) {
          const s = String(cell ?? "").trim();
          const a = s.match(/(\d+)월\s+(\d{4})/), b = s.match(/(\d{4})\s+(\d+)월/);
          if (!ym && (a || b)) ym = a ? [+a[2], +a[1]] : [+b[1], +b[2]];
        }
        if (!ym) continue;
        rows.forEach((row, r) => (row || []).forEach((v, c) => {
          const day = parseInt(v);
          if (!v || isNaN(v) || day < 1 || day > 31) return;
          const title = String(rows[r + 1]?.[c] ?? "").trim();
          if (!title || !isNaN(title)) return;
          const type = /고사|시험/.test(title) ? "시험" : /휴일|방학|휴업/.test(title) ? "휴업" : "행사";
          list.push({ date: `${ym[0]}-${String(ym[1]).padStart(2, "0")}-${String(day).padStart(2, "0")}`, type, title });
        }));
      }
      if (!list.length) throw new Error("일정을 찾지 못함");
      const batch = writeBatch(db);
      (await getDocs(col())).forEach(d => batch.delete(d.ref));
      list.forEach((ev, i) => batch.set(doc(col(), `e-${i}`), ev));
      await batch.commit();
      setToast(`학사일정 ${list.length}건 반영`);
    } catch (err) {
      setToast("학사일정 파일을 읽지 못했어요");
      console.error(err);
    }
  };
  return html`<div class="panel pad">
    <h3>학사일정</h3>
    <p class="desc">시험·휴업·행사(수업제외)는 수업에서 빠지고, '시험까지 남은 수업' 계산에 쓰여요.</p>
    <div class="ev-form">
      <input class="field" type="date" value=${f.date} onInput=${e => setF({ ...f, date: e.target.value })} aria-label="날짜" />
      <select class="field" value=${f.period} onChange=${e => setF({ ...f, period: e.target.value })} aria-label="교시">
        <option value="전교시">하루 종일</option>${PERIODS.map(p => html`<option value=${`${p}교시`}>${p}교시</option>`)}
      </select>
      <select class="field" value=${f.type} onChange=${e => setF({ ...f, type: e.target.value })} aria-label="종류">
        <option value="행사(수업제외)">행사 (수업 없음)</option><option value="시험">시험</option><option value="휴업">휴업·방학</option><option value="행사">행사 (수업 있음)</option>
      </select>
      <input class="field" placeholder="예: 축제(2학년)" value=${f.title} onInput=${e => setF({ ...f, title: e.target.value })} onKeyDown=${e => e.key === "Enter" && add()} aria-label="일정 이름" />
      <button class="btn primary wide" onClick=${add}>일정 추가</button>
    </div>
    <div class="ev-list">${upcoming.length === 0 ? html`<div class="row" style="color:var(--faint)">다가오는 일정이 없어요</div>` : upcoming.map(e => html`<div class="row">
      <span class="d">${mdw(e.date)}</span>
      <span class=${"tag " + (blocks(e) ? "event" : "ok")}>${e.type}</span>
      <span class="ti">${e.title}${e.period && e.period !== "전교시" ? ` (${e.period})` : ""}</span>
      <button aria-label="삭제" onClick=${() => deleteDoc(doc(col(), e.id))}><${Icon} n="trash" /></button>
    </div>`)}</div>
    <input type="file" accept=".xlsx,.xls" hidden ref=${input} onChange=${upload} />
    <button class="btn sm ghost" style="margin-top:10px" onClick=${() => input.current.click()}>학사일정 엑셀로 전체 다시 올리기</button>
  </div>`;
}

render(html`<${App} />`, document.getElementById("root"));
</script>
</body>
</html>
