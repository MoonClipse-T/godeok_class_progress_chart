<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12171c">
<title>고덕중 진도표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 바탕화면 진도표(desk.html)와 같은 모습: 어두운 바탕, 형광 노랑(오늘·지금), 크림색(수업 중),
   컴시간식 표시 — 바뀐 수업은 반 글씨만 빨간색, 빠진 수업은 빈칸 */
:root {
  --paper: #12171c; --surface: #19212a; --sunk: #202a33; --ink: #eef1ee; --muted: #a3afb4; --faint: #7f8b91;
  --rule: #26303a; --rule-2: #36424c;
  --accent: #ffe15a; --accent-ink: #12171c; --accent-soft: #2e2c1d;
  --hl: #ffe15a; --hl-ink: #12171c; --now: #f3f1e8;
  --red: #ff5a62; --warn: #ffb347; --warn-soft: #33270f; --done: #5cc6a2;
  --event: #b9a6ff; --event-soft: #262140;
  /* 차시 색(OKLCH): 같은 밝기·채도에서 색상(--h)만 바꿔 어느 차시든 대비가 같음. --t=1 인 차시는 *d 만큼 밝기를 옮김 */
  --kL: .36; --kC: .07; --kbL: .78; --kbC: .12; --kpL: .25; --kpC: .025; --klL: .5; --klC: .07;
  --kd: .06; --kbd: .07; --kpd: .025;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --serif: "Gowun Batang", "Batang", serif;
  --font: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { background: radial-gradient(120vw 90vh at 78% 0%, #24303a, var(--paper) 70%) fixed; font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
/* 자간은 크기별로: 큰 제목은 좁게(각 규칙에서), 12px 이하 작은 글씨는 살짝 넓게 */
.tl-cell .t, .tl-head .w, .ticket .when small, .tag, .count, .legend, .h-row .sub, .tl-bar .hint, nav.tabs button { letter-spacing: .01em; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--hl); outline-offset: 2px; }
svg { width: 18px; height: 18px; flex: none; }
.red { color: var(--red) !important; }

/* 누르면 살짝 눌림 */
.btn, .icon-btn, .ticket, .tl-cell > button, .seg button, nav.tabs button, .chips button { transition: transform 140ms var(--ease); }
.btn:active, .icon-btn:active, .ticket:active, .seg button:active, nav.tabs button:active, .chips button:active { transform: scale(.97); }
.tl-cell > button:active { transform: scale(.95); }

.app { max-width: 1280px; margin: 0 auto; padding: 0 16px calc(88px + env(safe-area-inset-bottom)); }
header.top { display: flex; align-items: center; gap: 14px; padding: 18px 0 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--hl); color: var(--hl-ink); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 19px; height: 19px; }
.brand b { display: block; font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.brand small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--done); flex: none; }
.sync i.old { background: var(--warn); }

/* 휴대폰 아래 탭 막대: 시간표가 밑으로 비쳐 지나가는 반투명 재질 */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
  background: color-mix(in srgb, var(--paper) 70%, transparent); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: 0 -1px 0 var(--rule); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
@media (prefers-reduced-transparency: reduce) { nav.tabs { background: var(--paper); backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media (prefers-contrast: more) { :root { --rule: var(--rule-2); --faint: var(--muted); } nav.tabs { background: var(--paper); } }
nav.tabs button { flex: 1; border: 0; background: none; padding: 6px 0 4px; font-size: 11.5px; font-weight: 600; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 12px; position: relative; }
nav.tabs button svg { width: 23px; height: 23px; }
nav.tabs button.on { color: var(--ink); }
nav.tabs button.on svg { color: var(--hl); }
nav.tabs .badge { position: absolute; top: 1px; left: calc(50% + 7px); background: var(--warn); color: var(--hl-ink); font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
@media (min-width: 900px) {
  .app { padding-bottom: 40px; }
  header.top { padding: 22px 0 18px; }
  nav.tabs { position: static; order: 2; background: rgba(255,255,255,.04); border: 1px solid var(--rule); border-radius: 14px; padding: 3px; gap: 2px; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; }
  nav.tabs button { flex: none; white-space: nowrap; flex-direction: row; font-size: 14px; padding: 7px 15px; gap: 7px; border-radius: 11px; color: var(--muted); }
  nav.tabs button svg { width: 17px; height: 17px; }
  nav.tabs button.on { background: var(--sunk); }
  nav.tabs .badge { position: static; margin-left: 1px; }
  .sync { order: 3; margin-left: 4px; }
  .brand { margin-right: auto; }
}

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; }
.h-row { display: flex; align-items: center; gap: 8px; margin: 26px 2px 10px; }
.h-row:first-child { margin-top: 0; }
.h-row h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.h-row .sub { font-size: 12.5px; color: var(--faint); }
.h-row .btn { margin-left: auto; }
.count { font-size: 12px; font-weight: 700; min-width: 22px; height: 20px; border-radius: 10px; display: inline-grid; place-items: center; padding: 0 6px; background: var(--sunk); color: var(--muted); }
.count.red { background: var(--sunk); color: var(--red); }

.btn { border: 1px solid var(--rule-2); background: var(--sunk); border-radius: 12px; padding: 9px 15px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled) { background: #28333d; }
  .btn.primary:hover:not(:disabled) { background: #fff07a; }
  .btn.ghost:hover { color: var(--ink); background: var(--sunk); }
}
.icon-btn { border: 1px solid var(--rule-2); background: var(--sunk); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--muted); }

/* 반 이름: 컴시간처럼 글자만. 바뀐 수업이면 .red */
.chip { display: inline-flex; align-items: center; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; color: var(--ink); }
.chip.lg { font-family: var(--serif); font-size: 30px; line-height: 1; }
.chip.solid { font-family: var(--serif); font-size: 30px; line-height: 1; }

/* 차시 색: .k 가 --k-bg(바탕) --k-bar(진한 색) --k-line(테두리)을 정함. tint 가 없으면 무채색 */
.k { --k-bg: var(--sunk); --k-bar: var(--ink); --k-line: var(--rule-2); }
.k.tint { --k-bg: oklch(calc(var(--kL) + var(--t, 0) * var(--kd)) var(--kC) var(--h)); --k-bar: oklch(calc(var(--kbL) + var(--t, 0) * var(--kbd)) var(--kbC) var(--h)); --k-line: oklch(var(--klL) var(--klC) var(--h)); }
.k.plan { --k-bg: rgba(255,255,255,.035); --k-bar: var(--muted); --k-line: var(--rule-2); }
.k.plan.tint { --k-bg: oklch(calc(var(--kpL) + var(--t, 0) * var(--kpd)) var(--kpC) var(--h)); --k-bar: oklch(calc(var(--kbL) + var(--t, 0) * var(--kbd)) var(--kbC) var(--h)); }
.k.over { --k-bg: transparent; --k-line: var(--rule); }
.step { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; font-size: 12.5px; font-weight: 700; background: var(--k-bar); color: var(--paper); flex: none; }
.plan .step { background: transparent; color: var(--k-bar); box-shadow: inset 0 0 0 1.5px var(--k-bar); }
.step.lg { min-width: 30px; height: 30px; border-radius: 15px; font-size: 15px; }
.tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }
.tag.event { background: var(--event-soft); color: var(--event); }
.tag.ok { background: #1b3a2f; color: var(--done); }
.tag svg { width: 12px; height: 12px; }

/* 오늘 */
.today-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
@media (min-width: 900px) { .today-layout { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 32px; align-items: start; } }
/* 옆으로 밀 때 세로 스크롤은 브라우저에 맡기고, 넘어가는 시간표가 옆 칸을 덮지 않게 자름 (테두리·그림자 여유 8px) */
section.day { touch-action: pan-y; overflow: clip; overflow-clip-margin: 8px; }
.day-pane { will-change: transform; }
.daybar { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 16px; }
.daybar h2 { margin: 0; font-family: var(--serif); font-size: 44px; line-height: 1; letter-spacing: -.03em; font-weight: 700; }
.daybar h2 small { display: block; font-family: var(--font); font-size: 14px; letter-spacing: 0; font-weight: 600; color: var(--hl); margin-bottom: 10px; }
.daybar .spacer { flex: 1; }
.banner { display: flex; align-items: center; gap: 10px; padding: 13px 16px; margin-bottom: 18px; border-radius: 14px; font-weight: 600; font-size: 14px; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); width: 100%; text-align: left; background: var(--warn-soft); color: var(--warn); }
.banner b { font-size: 18px; }
.banner .go { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; font-size: 13px; }

.periods { display: flex; flex-direction: column; gap: 8px; }
.ticket { display: grid; grid-template-columns: 58px 1fr; align-items: stretch; width: 100%; text-align: left; color: inherit; padding: 0; overflow: hidden;
  background: var(--k-bg); border: 1.5px solid var(--k-line); border-radius: 16px; }
.ticket.plan { border-style: dashed; }
.ticket .when { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-right: 1.5px solid var(--k-line); padding: 12px 0; }
.ticket.plan .when { border-right-style: dashed; }
.ticket .when b { font-size: 22px; font-weight: 700; line-height: 1; letter-spacing: -.03em; }
.ticket .when small { font-size: 11px; color: var(--muted); font-weight: 500; }
.ticket .body { min-width: 0; padding: 11px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.ticket .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ticket .row1 .chip { font-size: 20px; }
.ticket .name { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket .name.dim { color: var(--muted); font-weight: 500; font-size: 14px; }
.ticket .name small { font-weight: 400; color: var(--muted); font-size: 13px; }
/* 수업 중: 바탕화면처럼 크림색 칸 */
.k.ticket.now { --k-bg: var(--now); --k-line: var(--now); color: var(--hl-ink); } /* .k.plan.tint 보다 뒤·같은 세기라 이게 이김 */
.ticket.now .chip { color: var(--hl-ink); }
.ticket.now .when small, .ticket.now .name small, .ticket.now .name.dim { color: #4a535a; }
.ticket.todo { --k-line: var(--warn); border-style: solid; }
.ticket.todo .when { border-right-style: solid; }
.ticket.blocked { opacity: .6; }
.ticket.done { opacity: .82; }
.ticket.free { background: transparent; border: 1.5px dashed var(--rule); grid-template-columns: 58px 1fr; cursor: default; opacity: 1; }
.ticket.free .when { border-right: 0; padding: 7px 0; }
.ticket.free .when b { font-size: 15px; color: var(--faint); }
.ticket.free .body { padding: 7px 14px; justify-content: center; font-size: 13px; color: var(--faint); min-height: 18px; }
.status { margin-left: auto; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.status.todo { color: var(--warn); }
.status.done { color: var(--done); }
.status.now { color: var(--hl-ink); background: var(--hl); padding: 1px 8px; border-radius: 99px; }
.status svg { width: 15px; height: 15px; }

.list { display: flex; flex-direction: column; }
.list > * { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--rule); background: none; width: 100%; text-align: left; font-size: 13.5px; min-width: 0; }
.list > *:last-child { border-bottom: 0; }
.list .when { width: 104px; flex: none; white-space: nowrap; color: var(--muted); font-weight: 500; }
.list .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .n { font-size: 12px; color: var(--muted); }
.list .note { color: var(--faint); font-size: 12.5px; }
@media (hover: hover) and (pointer: fine) { button.list-row:hover { background: var(--sunk); } }
.minibar { width: 54px; height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; flex: none; }
.minibar i { display: block; height: 100%; background: var(--k-bar); }

/* 연간 진도표 */
.tl-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tl-bar h2 { margin: 0; font-family: var(--serif); font-size: 30px; letter-spacing: -.03em; font-weight: 700; }
.tl-bar .hint { font-size: 12.5px; color: var(--faint); }
.tl-bar .spacer { flex: 1; }
.seg { display: inline-flex; background: rgba(255,255,255,.04); border: 1px solid var(--rule); border-radius: 11px; padding: 2px; }
.seg button { border: 0; background: none; min-height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--sunk); color: var(--ink); }
.seg .sw { width: 22px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, oklch(.7 .13 230), oklch(.7 .13 330), oklch(.7 .13 145), oklch(.7 .13 283)); }
.seg .sw.mono { background: linear-gradient(90deg, var(--ink), var(--rule-2)); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 0; padding: 0; background: none; border-radius: 9px; }
.chips button .chip { padding: 6px 12px; font-size: 14px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--rule-2); transition: background-color 150ms ease, color 150ms ease; }
.chips button.on .chip { background: var(--ink); color: var(--paper); box-shadow: none; }
.tl { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; position: relative; }
.tl-in { display: flex; width: max-content; }
.tl-col { flex: none; width: var(--colw); border-right: 1px solid var(--rule); }
.tl-col.mon { border-left: 1.5px solid var(--rule-2); }
.tl-col.today { background: rgba(255,225,90,.06); }
.tl-col.collapsed { width: 34px; background: repeating-linear-gradient(-45deg, transparent 0 5px, rgba(255,255,255,.03) 5px 10px); }
.tl-head { height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 1px solid var(--rule); position: relative; }
.tl-head .m { position: absolute; top: 4px; left: 7px; font-size: 11px; font-weight: 700; color: var(--hl); }
.tl-head .d { font-size: 15px; font-weight: 700; }
.tl-head .w { font-size: 11.5px; font-weight: 500; color: var(--muted); }
.tl-col.today .tl-head .d { background: var(--hl); color: var(--hl-ink); border-radius: 7px; padding: 0 7px; }
.tl-side { position: sticky; left: 0; z-index: 5; width: 38px; background: var(--surface); border-right: 1px solid var(--rule); flex: none; }
.tl-side .tl-head { font-size: 11px; color: var(--faint); font-weight: 600; }
.tl-p { height: var(--rowh); display: grid; place-items: center; border-bottom: 1px solid var(--rule); font-weight: 700; color: var(--faint); font-size: 15px; }
.tl-p:last-child, .tl-cell:last-child { border-bottom: 0; }
.tl-cell { height: var(--rowh); border-bottom: 1px solid var(--rule); padding: 3px; }
.tl-cell > button, .tl-cell > div { width: 100%; height: 100%; border: 0; border-radius: 10px; padding: 5px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; position: relative; overflow: hidden; color: inherit; }
.tl-cell .has { background: var(--k-bg); box-shadow: inset 0 0 0 1px var(--k-line); }
.tl-cell .has.plan { box-shadow: none; outline: 1.5px dashed var(--k-line); outline-offset: -1.5px; }
.tl-cell .has.now { --k-bg: var(--now); --k-line: var(--now); color: var(--hl-ink); }
.tl-cell .has.now .chip, .tl-cell .has.now .t { color: var(--hl-ink); }
.tl-cell .has.todo { outline: 1.5px solid var(--warn); outline-offset: -1.5px; box-shadow: none; }
.tl-cell .r1 { display: flex; align-items: center; gap: 5px; width: 100%; }
.tl-cell .chip { font-size: 15px; }
.tl-cell .step { min-width: 18px; height: 18px; font-size: 11px; padding: 0 4px; border-radius: 9px; }
.tl-cell .t { font-size: 11px; line-height: 1.3; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
.tl-cell .plan .t { color: var(--muted); }
.tl-cell .t.todo { color: var(--warn); font-weight: 600; }
.tl-cell .t.ev { color: var(--event); font-weight: 600; }
.tl-cell .blocked { opacity: .5; }
.tl-cell .dim { opacity: .15; }
.tl-cell .ok { position: absolute; right: 5px; top: 5px; color: var(--k-bar); }
.tl-cell .ok svg { width: 14px; height: 14px; stroke-width: 3; }
.tl-v { writing-mode: vertical-rl; font-size: 12px; font-weight: 600; color: var(--event); padding: 10px 0; margin: 0 auto; letter-spacing: .05em; height: calc(var(--rowh) * 7); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.legend { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 20px; height: 13px; border-radius: 4px; display: inline-block; }

/* 학급 */
.class-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr)); }
.class-card { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.class-card .head { display: flex; align-items: center; gap: 12px; }
.class-card .big { font-family: var(--serif); font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1; color: var(--hl); }
.class-card .big small { font-family: var(--font); font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
.class-card .exam { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); font-weight: 500; line-height: 1.25; }
.class-card .exam b { display: block; color: var(--ink); font-size: 18px; font-weight: 700; }
.bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--k-bar); border-radius: 4px; }
.kv { font-size: 13.5px; display: grid; grid-template-columns: 34px 1fr; gap: 6px 8px; margin: 0; align-items: center; }
.kv dt { color: var(--faint); font-weight: 500; font-size: 12.5px; }
.kv dd { margin: 0; min-width: 0; display: flex; align-items: center; gap: 6px; }

.login .panel { padding: 36px 28px 30px; max-width: 380px; width: 100%; text-align: center; }

.login .mark { width: 56px; height: 56px; border-radius: 17px; background: var(--hl); color: var(--hl-ink); display: inline-grid; place-items: center; }
.login .mark svg { width: 30px; height: 30px; }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 50; box-shadow: 0 8px 28px rgba(0,0,0,.4); white-space: nowrap; animation: toast-in 220ms var(--ease); }
@keyframes toast-in { from { transform: translate(-50%, 10px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  dialog.sheet[open], .toast { animation: fade 150ms ease; }
  .btn:active, .icon-btn:active, .ticket:active, .tl-cell > button:active, .seg button:active, nav.tabs button:active, .chips button:active { transform: none; }

</head>
<body>
<div id="root"></div>
<script type="module">
import { html, render, useState, useEffect, useMemo, useRef, useLayoutEffect } from "https://unpkg.com/htm@3.1.1/preact/standalone.module.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

import { FB_CONFIG, APP_ID, BELL, PERIODS, WD, YEAR_END, iso, fromIso, addDays, isWeekend, md, mdw, atTime, gradeOf, slotKey, nextSchoolDay, buildModel, slotInfo, lessonDoc } from "./model.js";

const fbApp = initializeApp(FB_CONFIG);
const auth = getAuth(fbApp);
const db = initializeFirestore(fbApp, { localCache: persistentLocalCache() });

// 차시 색: 빨강·주황(시간표 변경·기록 필요 표시색)을 뺀 8색(88°~340°, 36° 간격).
// 1·2차시 차이가 가장 멀어지게 섞은 순서(전수 탐색 최적). 3차시 차이·8차시 차이는 색이 가까워서
// 밝기(--t)를 엇갈려 구분: 홀짝으로 바뀌고 8차시마다 한 번 더 뒤집힘
const HUE_ORDER = [0, 3, 6, 1, 4, 7, 2, 5];
const hue = step => 88 + HUE_ORDER[(step - 1) % 8] * 36;
const shade = step => (step + Math.floor((step - 1) / 8)) % 2;

// ---------- 데이터 ----------
function useUserData(user) {
  const [data, setData] = useState({ meta: {}, lessons: {}, events: [], ready: false });
  useEffect(() => {
    if (!user) return;
    const base = ["artifacts", APP_ID, "users", user.uid];
    let got = 0;
    const done = () => { if (++got >= 3) setData(d => ({ ...d, ready: true })); };
    const subs = [
      onSnapshot(collection(db, ...base, "meta"), s => { const m = {}; s.forEach(x => m[x.id] = x.data()); setData(d => ({ ...d, meta: m })); done(); }, done),
      onSnapshot(collection(db, ...base, "lessons"), s => { const m = {}; s.forEach(x => m[x.id] = x.data()); setData(d => ({ ...d, lessons: m })); done(); }, done),
      onSnapshot(collection(db, ...base, "events"), s => { setData(d => ({ ...d, events: s.docs.map(x => ({ id: x.id, ...x.data() })) })); done(); }, done),
    ];
    return () => subs.forEach(u => u());
  }, [user]);
  return data;
}
const ref = (user, col, id) => doc(db, "artifacts", APP_ID, "users", user.uid, col, id);

// 시간표·진도 계산은 model.js
const useModel = ({ meta, lessons, events }) => useMemo(() => buildModel({ meta, lessons, events }), [meta, lessons, events]);

// ---------- 움직임 (Apple 'Designing Fluid Interfaces' 방식) ----------
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
// 임계 감쇠 스프링(damping 1.0, 튕김 없음)의 정확한 해. 지금 값·속도에서 출발하므로 도중에 잡거나 방향을 바꿔도 끊김 없음
function spring(from, to, v0, response, onFrame, onDone) {
  if (reduceMotion()) { onFrame(to); onDone?.(); return () => { }; }
  const w = 2 * Math.PI / response, x0 = from - to, t0 = performance.now();
  let id;
  // 시각은 직접 잼: rAF 가 넘겨주는 시각은 기준이 달라 t 가 음수가 되는 브라우저가 있음
  const step = () => {
    const t = Math.max(0, performance.now() - t0) / 1000, e = Math.exp(-w * t);
    const x = (x0 + (v0 + w * x0) * t) * e, v = (v0 - w * t * (v0 + w * x0)) * e;
    if (Math.abs(x) < 0.5 && Math.abs(v) < 20) { onFrame(to); onDone?.(); return; }
    onFrame(to + x);
    id = requestAnimationFrame(step);
  };
  id = requestAnimationFrame(step);
  return () => cancelAnimationFrame(id);
}
// 손을 뗀 속도로 어디까지 미끄러질지 (스크롤 감속과 같은 식)
const project = (v, rate = 0.998) => v / 1000 * rate / (1 - rate);
// 경계 너머로 끌면 점점 덜 따라옴
const rubber = (d, dim, c = 0.55) => d * dim * c / (dim + c * Math.abs(d));
// 최근 80ms 포인터 기록 → 속도(px/s)
const track = (hist, v, t) => { hist.push({ v, t }); while (hist.length > 2 && t - hist[0].t > 80) hist.shift(); };
const velocity = hist => { const a = hist[0], b = hist[hist.length - 1]; return a && b && b.t > a.t ? (b.v - a.v) / (b.t - a.t) * 1000 : 0; };

// ---------- 아이콘 ----------
const ICONS = {
  today: "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM9 16l2 2 4-4",
  year: "M3 5h18M3 12h18M3 19h18M8 3v18M14 3v18",
  classes: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
  settings: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z",
  left: "M15 18l-6-6 6-6", right: "M9 18l6-6-6-6", x: "M18 6L6 18M6 6l12 12",
  check: "M20 6L9 17l-5-5", pen: "M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z",
  alert: "M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",
  dot: "M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0",
  swap: "M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3",
  book: "M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z",
  trash: "M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6",
};
const Icon = ({ n }) => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${ICONS[n]} /></svg>`;
const chgLabel = s => s.from ? `${s.from}→${s.p}교시 이동` : s.was ? `${s.was} → ${s.c}` : "추가";
// 반 이름. 컴시간처럼 바뀐(새로 들어온) 수업이면 글씨만 빨간색
const Chip = ({ c, lg, solid, red }) => html`<span class=${"chip" + (lg ? " lg" : "") + (solid ? " solid" : "") + (red ? " red" : "")}>${c}</span>`;
// 차시 색 입히기: k(무채색 바탕) + tint(차시 색) + plan(아직 안 한 수업 = 점선·연하게)
const kc = (m, step, planned) => `k${step && m.tinted ? " tint" : ""}${planned ? " plan" : ""}`;
const kh = step => step ? `--h:${hue(step)};--t:${shade(step)}` : "";
const Step = ({ n, lg }) => n ? html`<span class=${"step" + (lg ? " lg" : "")} title=${`${n}차시`}>${n}</span>` : null;

// ---------- 앱 ----------
function App() {
  const [user, setUser] = useState(undefined);
  useEffect(() => onAuthStateChanged(auth, setUser), []);
  if (user === undefined) return null;
  if (!user) return html`<${Login} />`;
  return html`<${Main} user=${user} />`;
}

function Login() {
  const [err, setErr] = useState("");
  const go = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => setErr(e.message));
  return html`<div class="login"><div class="panel">
    <div class="mark"><${Icon} n="book" /></div>
    <h1>고덕중 진도표</h1>
    <p>컴시간 시간표가 자동으로 들어오고,<br />수업이 끝나면 한 번 눌러 진도를 남겨요.</p>
    <button class="btn primary" style="width:100%;padding:13px" onClick=${go}>Google 계정으로 시작</button>
    ${err && html`<p style="color:var(--red);margin:12px 0 0;font-size:13px">${err}</p>`}
  </div></div>`;
}

function Main({ user }) {
  const data = useUserData(user);
  const m = useModel(data);
  const [tab, setTab] = useState(() => { try { return localStorage.getItem("tab") || "today"; } catch { return "today"; } });
  const [now, setNow] = useState(new Date());
  const [sheet, setSheet] = useState(null); // { slot, queue }
  const [toast, setToast] = useState("");
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(t); }, []);
  useEffect(() => { try { localStorage.setItem("tab", tab); } catch { } }, [tab]);
  // 알림은 아래에서 올라와서, 사라질 때도 아래로 내려감
  const [toastOut, setToastOut] = useState(false);
  useEffect(() => {
    if (!toast) return;
    setToastOut(false);
    const a = setTimeout(() => setToastOut(true), 2000), b = setTimeout(() => setToast(""), 2200);
    return () => { clearTimeout(a); clearTimeout(b); };
  }, [toast]);

  const pending = m.tt ? m.pending(now) : [];
  const open = (slot, queue = false) => setSheet({ slot, queue });

  const saveLesson = async (slot, rec) => {
    const k = slotKey(slot.date, slot.p);
    if (rec === null) await deleteDoc(ref(user, "lessons", k));
    else await setDoc(ref(user, "lessons", k), lessonDoc(slot, rec));
    // 밀린 기록 모드면 다음 밀린 수업을 바로 띄움
    const next = sheet?.queue && rec !== null && pending.find(s => slotKey(s.date, s.p) !== k);
    setSheet(next ? { slot: next, queue: true } : null);
    setToast(rec === null ? "기록을 지웠어요" : next ? `${slot.c} 기록함 · 다음 밀린 수업` : `${slot.c} 기록함`);
  };
  const saveMeta = (id, val) => setDoc(ref(user, "meta", id), val, { merge: true });

  const stale = m.syncedAt && (now - m.syncedAt) > 3 * 86400000;
  const tabs = [["today", "오늘", "today"], ["year", "진도표", "year"], ["classes", "학급", "classes"], ["settings", "설정", "settings"]];
  const ctx = { m, now, open, user, saveMeta, setToast, setTab, pending };

  return html`<div class="app">
    <header class="top">
      <div class="brand"><div class="mark"><${Icon} n="book" /></div>
        <div style="min-width:0"><b>진도표</b><small>${m.tt ? `${m.tt.teacher} 선생님, ${m.tt.subject}` : "고덕중학교"}</small></div></div>
      <div class="sync" title=${m.syncedAt ? `마지막 동기화 ${m.syncedAt.toLocaleString("ko-KR")}` : ""}>
        ${m.tt ? html`<i class=${stale ? "old" : ""}></i><span>컴시간 ${m.tt.savedAt.slice(5, 16).replace("-", "/")}</span>` : html`<i class="old"></i>시간표 연동 전`}
      </div>
      <nav class="tabs">${tabs.map(([k, label, ic]) => html`<button class=${tab === k ? "on" : ""} aria-current=${tab === k ? "page" : null} onClick=${() => setTab(k)}><${Icon} n=${ic} />${label}${k === "today" && pending.length > 0 && html`<span class="badge">${pending.length}</span>`}</button>`)}</nav>
    </header>
    ${!data.ready ? html`<div class="empty">불러오는 중…</div>`
      : !m.tt && tab !== "settings" ? html`<div class="panel empty"><b>아직 시간표가 없어요</b>설정 탭의 'PC 연동' 안내대로 알림이 PC에서 한 번만 연결하면 자동으로 들어옵니다.<br /><br /><button class="btn primary" onClick=${() => setTab("settings")}>연동하러 가기</button></div>`
      : tab === "today" ? html`<${Today} ...${ctx} />`
      : tab === "year" ? html`<${Year} ...${ctx} />`
      : tab === "classes" ? html`<${Classes} ...${ctx} />`
      : html`<${Settings} ...${ctx} />`}
    ${sheet && html`<${RecordSheet} key=${slotKey(sheet.slot.date, sheet.slot.p)} slot=${sheet.slot} queue=${sheet.queue ? pending.length : 0} m=${m} onSave=${saveLesson} onClose=${() => setSheet(null)} />`}
    ${toast && html`<div class=${"toast" + (toastOut ? " out" : "")} role="status">${toast}</div>`}
  </div>`;
}

// 교시 상태: done / todo(끝났는데 기록 없음) / now / later / blocked
function slotState(m, s, now) {
  if (s.event) return "blocked";
  if (m.lessons[slotKey(s.date, s.p)]) return "done";
  if (atTime(s.date, BELL[s.p][1]) <= now) return "todo";
  if (atTime(s.date, BELL[s.p][0]) <= now) return "now";
  return "later";
}

function Today({ m, now, open, setTab, pending }) {
  const todayIso = iso(now);
  const [date, setDate] = useState(isWeekend(todayIso) ? nextSchoolDay(todayIso) : todayIso);
  const slots = m.slotsFor(date);
  const lastP = Math.max(0, ...slots.filter(s => s.c || s.removed).map(s => s.p));
  const isToday = date === todayIso;
  const changes = m.changesFrom(todayIso, 14).filter(s => !s.removed); // 빠진 칸은 빈칸일 뿐이라 목록엔 새로 들어온 수업만

  // 날짜 넘기기: 시간표가 손가락을 1:1로 따라오고, 놓으면 그 속도 그대로 다음 날로 넘어가거나 제자리로 돌아옴.
  // 화살표 버튼도 같은 길(밀려 나가고 반대편에서 들어옴)로 움직임
  const pane = useRef(), x = useRef(0), stopX = useRef(null), swipe = useRef(null);
  const setX = v => { x.current = v; if (pane.current) pane.current.style.transform = v ? `translateX(${v}px)` : ""; };
  useEffect(() => () => stopX.current?.(), []);
  const go = (dir, v0 = 0) => {
    stopX.current?.();
    const w = (pane.current?.offsetWidth || 400) + 24;
    stopX.current = spring(x.current, -dir * w, v0, 0.22, setX, () => {
      setDate(d => nextSchoolDay(d, dir));
      setX(dir * w);
      stopX.current = spring(dir * w, 0, v0, 0.34, setX);
    });
  };
  const sw = {
    onPointerDown: e => {
      if (e.pointerType === "mouse") return; // 마우스는 화살표 버튼으로
      swipe.current = { x0: e.clientX, y0: e.clientY, on: false, hist: [] };
    },
    onPointerMove: e => {
      const g = swipe.current;
      if (!g) return;
      if (!g.on) {
        const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
        if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swipe.current = null; return; } // 세로 스크롤에 양보
        if (Math.abs(dx) < 10) return;
        // 10px 넘게 옆으로 움직였을 때부터 잡음 (그 자리 기준이라 튀지 않음)
        stopX.current?.();
        Object.assign(g, { on: true, x0: e.clientX - x.current });
        e.currentTarget.setPointerCapture(e.pointerId);
      }
      setX(e.clientX - g.x0);
      track(g.hist, x.current, e.timeStamp);
    },
    onPointerUp: e => {
      const g = swipe.current;
      swipe.current = null;
      if (!g?.on) return;
      track(g.hist, x.current, e.timeStamp);
      const v = velocity(g.hist), end = x.current + project(v, 0.99);
      if (Math.abs(end) > pane.current.offsetWidth * 0.35) go(end < 0 ? 1 : -1, v);
      else stopX.current = spring(x.current, 0, v, 0.3, setX);
    },
  };
  sw.onPointerCancel = sw.onPointerUp;

  return html`<div class="today-layout">
    <section class="day" ...${sw}>
      ${pending.length > 0 && html`<button class="banner" onClick=${() => open(pending[0], true)}>
        <${Icon} n="alert" /><span>기록 안 한 수업 <b>${pending.length}</b>개</span><span class="go">차례로 기록하기<${Icon} n="right" /></span></button>`}
      <div class="daybar">
        <h2><small>${isToday ? mdw(date) : WD[fromIso(date).getDay()] + "요일"}</small>${isToday ? "오늘" : md(date)}</h2>
        <div class="spacer"></div>
        ${!isToday && html`<button class="btn sm" onClick=${() => setDate(todayIso)}>오늘로</button>`}
        <button class="icon-btn" aria-label="이전 날" onClick=${() => go(-1)}><${Icon} n="left" /></button>
        <button class="icon-btn" aria-label="다음 날" onClick=${() => go(1)}><${Icon} n="right" /></button>
      </div>
      <div class="day-pane" ref=${pane}>
      ${m.dayOff(date) ? html`<div class="panel empty"><b>${m.dayOff(date).title}</b>학사일정상 수업이 없는 날이에요.</div>`
        : lastP === 0 ? html`<div class="panel empty"><b>수업 없는 날</b></div>`
        : html`<div class="periods">${slots.filter(s => s.p <= lastP).map(s => {
          const when = html`<div class="when"><b>${s.p}</b><small>${BELL[s.p][0]}</small></div>`;
          // 빠진 수업은 컴시간처럼 그냥 빈칸
          if (!s.c) return html`<div class="ticket free"><div class="when"><b>${s.p}</b></div><div class="body">${s.removed ? "" : "공강"}</div></div>`;
          const st = slotState(m, s, now), i = slotInfo(m, s);
          return html`<button class=${`ticket ${kc(m, i.step, i.planned)} ${i.over ? "over" : ""} ${st}`} style=${kh(i.step)} onClick=${() => open(s)} title=${s.changed ? chgLabel(s) : ""}>
            ${when}
            <div class="body">
              <div class="row1"><${Chip} c=${s.c} red=${s.changed} /><${Step} n=${i.step} />
                ${s.event && html`<span class="tag event">${s.event.title}</span>`}
                ${st === "done" && html`<span class="status done"><${Icon} n="check" />기록함</span>`}
                ${st === "todo" && html`<span class="status todo"><${Icon} n="pen" />기록하기</span>`}
                ${st === "now" && html`<span class="status now">수업 중</span>`}
              </div>
              ${s.event ? html`<div class="name dim">학사일정으로 수업 없음</div>`
                : i.over ? html`<div class="name dim">차시 계획 끝. 설정에서 다음 차시를 적어 주세요</div>`
                : i.name ? html`<div class="name">${i.name}${i.note && html`<small> · ${i.note}</small>`}</div>`
                : html`<div class="name dim">차시 기록 전</div>`}
            </div>
          </button>`;
        })}</div>`}
      </div>
    </section>
    <section>
      <div class="h-row"><h3>시간표 변경</h3><span class=${"count" + (changes.length ? " red" : "")}>${changes.length}</span><span class="sub">앞으로 2주</span></div>
      ${changes.length === 0 ? html`<div class="panel empty" style="padding:18px">바뀐 시간표가 없어요</div>`
        : html`<div class="panel list">${changes.map(s => html`<button class="list-row" onClick=${() => setDate(s.date)}>
          <span class="when">${mdw(s.date)} ${s.p ? `${s.p}교시` : ""}</span>
          ${s.allOff ? html`<span class="note">하루 수업이 모두 빠졌어요</span>`
            : html`<${Chip} c=${s.c} red /><span class="note">${s.from ? `${s.from}교시에서 옮겨 옴` : s.was ? `원래 ${s.was}` : "새로 생김"}</span>`}
        </button>`)}</div>`}
      <div class="h-row"><h3>학급별 진도</h3><button class="btn sm ghost" onClick=${() => setTab("classes")}>자세히</button></div>
      <div class="panel list">${m.classes.map(c => {
        const total = m.planOf(c).length, p = m.progress(c);
        return html`<div class=${kc(m, p)} style=${kh(p)}><${Chip} c=${c} /><${Step} n=${p} />
          <div class="t">${p ? m.planName(c, p) : html`<span style="color:var(--faint)">아직 기록 없음</span>`}</div>
          ${total > 0 && html`<div class="minibar"><i style=${`width:${Math.min(100, p / total * 100)}%`}></i></div><span class="n">${p}/${total}</span>`}</div>`;
      })}</div>
    </section>
  </div>`;
}

// 연간 진도표: 학기 전체를 가로로. 마우스 휠(위/아래)로 좌우 이동, 모바일은 손가락으로 밀기.
function Year({ m, now, open, saveMeta }) {
  const todayIso = iso(now);
  const scroller = useRef();
  const [only, setOnly] = useState(null); // 특정 반만 강조
  const days = useMemo(() => {
    const out = [];
    for (let d = m.firstDay || todayIso; d <= YEAR_END; d = addDays(d, 1)) if (!isWeekend(d)) out.push(d);
    return out;
  }, [m.firstDay]);
  const narrow = typeof innerWidth !== "undefined" && innerWidth < 600;
  const colw = narrow ? 96 : 128, rowh = narrow ? 64 : 72;

  const centerOn = (date, smooth) => {
    const el = scroller.current?.querySelector(`[data-d="${date}"]`) || scroller.current?.querySelector(`[data-d^="${date.slice(0, 7)}"]`);
    if (el) scroller.current.scrollTo({ left: el.offsetLeft - scroller.current.clientWidth / 2 + el.offsetWidth / 2, behavior: smooth ? "smooth" : "auto" });
  };
  useLayoutEffect(() => { centerOn(isWeekend(todayIso) ? nextSchoolDay(todayIso) : todayIso, false); }, []);
  useEffect(() => {
    const el = scroller.current;
    const onWheel = e => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || e.shiftKey) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY * 1.6; // 아래로 굴리면 미래, 위로 굴리면 과거
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, []);
  const page = dir => scroller.current.scrollBy({ left: dir * colw * 5, behavior: "smooth" });

  return html`<div>
    <div class="tl-bar">
      <h2>진도표</h2><span class="hint">${narrow ? "옆으로 밀어서 이동" : "마우스 휠로 좌우 이동"}</span>
      <div class="spacer"></div>
      <div class="seg" role="group" aria-label="칸 색">
        <button class=${m.tinted ? "on" : ""} aria-pressed=${m.tinted} onClick=${() => saveMeta("prefs", { colorMode: "step" })}><i class="sw"></i>차시별 색</button>
        <button class=${m.tinted ? "" : "on"} aria-pressed=${!m.tinted} onClick=${() => saveMeta("prefs", { colorMode: "mono" })}><i class="sw mono"></i>무채색</button>
      </div>
      <button class="icon-btn" aria-label="이전 주" onClick=${() => page(-1)}><${Icon} n="left" /></button>
      <button class="btn sm" onClick=${() => centerOn(todayIso, true)}>오늘</button>
      <button class="icon-btn" aria-label="다음 주" onClick=${() => page(1)}><${Icon} n="right" /></button>
    </div>
    <div class="chips" role="group" aria-label="반 골라 보기">
      ${m.classes.map(c => html`<button class=${only === c ? "on" : ""} aria-pressed=${only === c} onClick=${() => setOnly(only === c ? null : c)}><${Chip} c=${c} /></button>`)}
    </div>
    <div class="panel tl" ref=${scroller} style=${`--colw:${colw}px;--rowh:${rowh}px`}>
      <div class="tl-in">
        <div class="tl-side"><div class="tl-head">교시</div>${PERIODS.map(p => html`<div class="tl-p">${p}</div>`)}</div>
        ${days.map((d, i) => {
          const off = m.dayOff(d), dt = fromIso(d);
          const monthStart = i === 0 || days[i - 1].slice(0, 7) !== d.slice(0, 7);
          const cls = `tl-col ${dt.getDay() === 1 ? "mon" : ""} ${d === todayIso ? "today" : ""} ${off ? "collapsed" : ""}`;
          if (off) return html`<div class=${cls} data-d=${d} title=${`${mdw(d)} ${off.title}`}>
            <div class="tl-head">${monthStart && html`<span class="m">${dt.getMonth() + 1}월</span>`}<span class="d" style="font-size:11px">${dt.getDate()}</span></div>
            <div class="tl-v">${off.title}</div></div>`;
          const slots = m.slotsFor(d);
          return html`<div class=${cls} data-d=${d}>
            <div class="tl-head">${monthStart && html`<span class="m">${dt.getMonth() + 1}월</span>`}<span class="d">${md(d)}</span><span class="w">${WD[dt.getDay()]}</span></div>
            ${slots.map(s => html`<div class="tl-cell">${renderCell(m, s, now, open, only)}</div>`)}
          </div>`;
        })}
      </div>
    </div>
    <div class="legend">
      ${m.tinted && html`<span><b style="color:var(--ink)">같은 색 = 같은 차시</b></span>`}
      <span><i class=${kc(m, 3)} style=${kh(3) + ";background:var(--k-bg);box-shadow:inset 0 0 0 1px var(--k-line)"}></i>기록함</span>
      <span><i class=${kc(m, 3, true)} style=${kh(3) + ";background:var(--k-bg);outline:1.5px dashed var(--k-line);outline-offset:-1.5px"}></i>앞으로 할 수업(예상 차시)</span>
      <span><b class="red">빨간 반</b>컴시간에서 바뀐 수업</span>
      <span>빈칸 빠진 수업</span>
      <span><i style="background:var(--now)"></i>수업 중</span>
      <span><i style="outline:1.5px solid var(--warn);outline-offset:-1.5px"></i>기록 필요</span>
      <span><i style="background:var(--event-soft)"></i>학사일정(수업 없음)</span>
    </div>
  </div>`;
}
function renderCell(m, s, now, open, only) {
  if (!s.c) return null; // 공강·빠진 수업은 빈칸
  const st = slotState(m, s, now), i = slotInfo(m, s);
  const cls = `has ${kc(m, i.step, i.planned)} ${i.over ? "over" : ""} ${st === "now" || st === "todo" ? st : ""} ${st === "blocked" ? "blocked" : ""} ${only && only !== s.c ? "dim" : ""}`;
  return html`<button class=${cls} style=${kh(i.step)} onClick=${() => open(s)} title=${[s.changed && chgLabel(s), i.step && m.stepTitle(s.c, i.step)].filter(Boolean).join("\n")}>
    <span class="r1"><${Chip} c=${s.c} red=${s.changed} />${st !== "blocked" && html`<${Step} n=${i.step} />`}</span>
    <span class=${"t " + (st === "todo" ? "todo" : st === "blocked" ? "ev" : "")}>
      ${st === "blocked" ? s.event.title : st === "todo" ? "기록 필요" : i.name}
    </span>
    ${st === "done" && html`<span class="ok"><${Icon} n="check" /></span>`}
  </button>`;
}

function Classes({ m, now, saveMeta }) {

  return html`<div>

    <div class="class-grid">${m.classes.map(c => {
      const total = m.planOf(c).length, p = m.progress(c), last = m.lastLesson(c);
      const exam = m.nextExam(gradeOf(c), today);
      const left = exam ? m.lessonsUntil(c, today, exam.date) : null;

        <div class="head"><${Chip} c=${c} lg solid />
          <span class="big">${p}<small>${total ? ` / ${total}차시` : "차시"}</small></span>

        </div>
        ${total > 0 && html`<div class="bar"><i style=${`width:${Math.min(100, p / total * 100)}%`}></i></div>`}
        <dl class="kv">

          <dt>다음</dt><dd class=${kc(m, p + 1, true)} style=${kh(p + 1)}><${Step} n=${p + 1} /><span><b>${m.planName(c, p + 1)}</b></span></dd>
        </dl>
        <textarea placeholder="학급 메모 (예: 실험 보고서 미제출 3명)" value=${m.notes[c] || ""}
          onBlur=${e => e.target.value !== (m.notes[c] || "") && saveMeta("notes", { [c]: e.target.value })}></textarea>
        ${recent.length > 0 && html`<div class="mini-list">${recent.map(l => html`<div><span>${md(l.date)} ${l.p}교시</span><span>${l.skip ? "수업 못함" : m.stepTitle(c, l.step)}${l.note ? " · " + l.note : ""}</span></div>`)}</div>`}
      </div>`;
    })}</div>
  </div>`;
}

function RecordSheet({ slot, queue, m, onSave, onClose }) {
  const dlg = useRef(), y = useRef(0), dist = useRef(1), stop = useRef(null), drag = useRef(null);
  // y = 아래로 내려간 거리. --p(0~1)로 뒷배경 어둡기·데스크톱 투명도를 같이 움직임
  const setY = v => {
    y.current = v;
    const d = dlg.current;
    if (!d) return;
    d.style.transform = v ? `translateY(${v}px)` : "";
    d.style.setProperty("--p", Math.max(0, Math.min(1, 1 - v / dist.current)).toFixed(3));
  };
  // 화면 아래에서 올라오고, 닫을 때는 같은 길로 내려감
  useLayoutEffect(() => {
    dlg.current.showModal();
    dist.current = innerHeight - dlg.current.getBoundingClientRect().top;
    setY(dist.current);
    stop.current = spring(dist.current, 0, 0, 0.36, setY);
    return () => stop.current?.();
  }, []);
  const exit = (v0 = 0, then) => {
    stop.current?.();
    stop.current = spring(y.current, dist.current, Math.max(0, v0), 0.3, setY, () => { dlg.current?.close(); then?.(); });
  };
  const save = rec => exit(0, () => onSave(slot, rec));
  // 머리 부분을 잡고 끌어내리기: 손가락 1:1, 위로는 고무줄, 놓을 때 속도로 닫을지 결정
  const grab = {
    onPointerDown: e => {
      if (e.button > 0 || e.target.closest("button")) return;
      stop.current?.();
      e.currentTarget.setPointerCapture(e.pointerId);
      drag.current = { y0: e.clientY - y.current, hist: [] };
    },
    onPointerMove: e => {
      const g = drag.current;
      if (!g) return;
      const v = e.clientY - g.y0;
      setY(v < 0 ? rubber(v, dist.current) : v);
      track(g.hist, y.current, e.timeStamp);
    },
    onPointerUp: e => {
      const g = drag.current;
      if (!g) return;
      drag.current = null;
      track(g.hist, y.current, e.timeStamp); // 멈췄다 놓으면 속도 0
      const v = velocity(g.hist);
      if (y.current + project(v) > dist.current * 0.4) exit(v);
      else stop.current = spring(y.current, 0, v, 0.32, setY);
    },
  };
  grab.onPointerCancel = grab.onPointerUp;
  const k = slotKey(slot.date, slot.p);
  const existing = m.lessons[k];
  const prev = m.stepBefore(slot.c, k);
  const plan = m.planOf(slot.c);
  const [step, setStep] = useState(existing ? existing.step || prev + 1 : prev + 1);
  const [note, setNote] = useState(existing?.note || "");
  const maxStep = Math.max(plan.length, prev + 1, step) + 3;
  const shown = existing ? (existing.skip ? 0 : existing.step) : prev + 1;

  return html`<dialog class="sheet" ref=${dlg} onClose=${onClose} onCancel=${e => { e.preventDefault(); exit(); }} onClick=${e => e.target === dlg.current && exit()}>
    <div class="sheet-in">
      <div class="grab" ...${grab}><div class="grabber"></div>
      <div class="sheet-head"><${Chip} c=${slot.c} lg solid red=${slot.changed} />
        <div><div style="font-weight:800">${mdw(slot.date)} ${slot.p}교시</div>
          <div class="meta">${slot.s}${slot.changed ? html`, <span style="color:var(--red);font-weight:800">${slot.from ? `${slot.from}교시에서 옮겨온 수업` : slot.was ? `시간표 변경 (원래 ${slot.was})` : "추가된 수업"}</span>` : ""}</div></div>
        <button class="icon-btn x" aria-label="닫기" onClick=${() => exit()}><${Icon} n="x" /></button>
      </div></div>
      ${queue > 0 && html`<div class="queue-note">밀린 기록 ${queue}개 남음. 저장하면 다음 수업이 바로 열려요</div>`}
      ${slot.event && html`<div class="tag event" style="align-self:flex-start;font-size:13px;padding:5px 10px">${slot.event.title}: 학사일정상 수업 없음</div>`}
      <div class=${"plan-box " + kc(m, shown, !existing)} style=${kh(shown)}>
        <${Step} n=${shown} lg />
        <div class="lbl">${existing ? "기록된 진도" : "이번 시간 계획"}</div>
        <div class="val">${existing?.skip ? "수업 못함" : m.planName(slot.c, shown)}</div>
        <div class="prev">지난 시간: ${prev ? m.stepTitle(slot.c, prev) : "기록 없음"}</div>
      </div>
      <div class="quick">
        <button class="btn primary" onClick=${() => save({ step: prev + 1, note })}><${Icon} n="check" />계획대로 했어요<small>${prev + 1}차시</small></button>
        ${prev > 0 && html`<button class="btn" onClick=${() => save({ step: prev, note })}>진도 못 나감, 이어서 했어요<small>${prev}차시 계속</small></button>`}
        <button class="btn" onClick=${() => save({ skip: true, step: 0, note })}>수업 못함<small>행사·자습 등</small></button>
      </div>
      <details class="manual" open=${!!existing}>
        <summary>차시 직접 고르기, 메모</summary>
        <label for="step">차시</label>
        <select id="step" class="field" value=${step} onChange=${e => setStep(+e.target.value)}>
          ${Array.from({ length: maxStep }, (_, i) => i + 1).map(n => html`<option value=${n}>${m.stepTitle(slot.c, n)}</option>`)}
        </select>
        <label for="note">메모</label>
        <textarea id="note" class="field" rows="2" placeholder="예: 실험 못 끝냄, 다음 시간 마무리" value=${note} onInput=${e => setNote(e.target.value)}></textarea>
        <div class="acts">
          ${existing && html`<button class="btn ghost" style="color:var(--red)" onClick=${() => save(null)}>기록 지우기</button>`}
          <button class="btn primary" onClick=${() => save({ step, note })}>저장</button>
        </div>
      </details>
    </div>
  </dialog>`;
}

function Settings({ m, user, saveMeta, setToast }) {
  const grades = [...new Set(m.classes.map(gradeOf))];
  const [g, setG] = useState(grades[grades.length - 1] || 1);
  const [draft, setDraft] = useState(null);
  const text = draft ?? (m.plans[g] || []).join("\n");
  const savePlan = async () => {
    await saveMeta("plans", { [g]: text.split("\n").map(s => s.trim()).filter(Boolean) });
    setDraft(null);
    setToast(`${g}학년 차시 계획 저장`);
  };
  const [showCode, setShowCode] = useState(false);
  const copy = async () => { await navigator.clipboard.writeText(user.refreshToken); setToast("연동 코드를 복사했어요"); };

  return html`<div class="settings">
    <div class="panel pad">
      <h3>차시 계획</h3>
      <p class="desc">한 줄에 한 차시씩 적어 주세요. 학년 내 모든 반이 같은 계획을 따라가며, 각 반이 어디까지 했는지는 자동으로 계산돼요. 엑셀·한글에서 복사해 붙여넣어도 돼요.</p>
      ${grades.length > 1 && html`<div class="seg grade-tabs">${grades.map(x => html`<button class=${x === g ? "on" : ""} onClick=${() => { setG(x); setDraft(null); }}>${x}학년</button>`)}</div>`}
      <textarea class="plan-text" value=${text} onInput=${e => setDraft(e.target.value)}
        placeholder=${"예)\nⅠ-1. 물질의 구성 – 원소\nⅠ-2. 원소 기호 익히기\nⅠ-3. 원자와 분자 모형 만들기 (실험)\n…"}></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
        <span style="font-size:12.5px;color:var(--muted)">${text.split("\n").filter(s => s.trim()).length}차시</span>
        <button class="btn primary" style="margin-left:auto" disabled=${draft === null} onClick=${savePlan}>저장</button>
      </div>
    </div>
    <div style="display:grid;gap:14px">
      <div class="panel pad">
        <h3>바탕화면 진도표 · 휴대폰 기록</h3>
        <p class="desc">노트북 바탕화면에 진도표를 띄워 두고, 수업이 끝나면 아이폰 동작 버튼으로 바로 기록해요. 휴대폰 기록은 몇 초 안에 바탕화면에 나타나요.</p>
        <ol class="steps">
          <li>Microsoft Store 에서 <b>Lively Wallpaper</b> 설치 → <b>+ 추가</b> → 아래 <b>바탕화면 주소</b>를 붙여넣기</li>
          <li>아이폰 <b>단축어</b> 앱 → 새 단축어 → <b>URL 열기</b>에 아래 <b>휴대폰 기록 주소</b> → 설정 → 동작 버튼 → 단축어로 지정</li>
        </ol>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          <button class="btn sm primary" onClick=${async () => { await navigator.clipboard.writeText(new URL(`desk.html#code=${user.refreshToken}`, location.href).href); setToast("바탕화면 주소를 복사했어요"); }}>바탕화면 주소 복사</button>
          <button class="btn sm" onClick=${async () => { await navigator.clipboard.writeText(new URL("quick.html", location.href).href); setToast("휴대폰 기록 주소를 복사했어요"); }}>휴대폰 기록 주소 복사</button>
          <a class="btn sm ghost" href="quick.html" style="text-decoration:none;color:inherit">기록 화면 열기</a>
        </div>
        <p class="desc" style="margin:10px 0 0;font-size:12px">바탕화면 주소에는 연동 코드가 들어 있어요. 비밀번호처럼 다뤄 주세요.</p>
      </div>
      <div class="panel pad">
        <h3>PC 연동 (알림이 → 진도표)</h3>
        <p class="desc">${m.tt ? html`마지막 동기화 ${m.syncedAt ? m.syncedAt.toLocaleString("ko-KR") : "-"} (${m.tt.source})` : "알림이가 깔린 학교 PC에서 한 번만 연결하면, 컴시간 시간표가 바뀔 때마다 자동으로 반영돼요."}</p>
        <ol class="steps">
          <li>아래 <b>연동 코드 복사</b></li>
          <li>알림이 PC의 진도표 폴더에서 <code>PC연동.bat</code> 더블클릭 → 붙여넣기</li>
          <li>이후엔 PC가 켜져 있는 동안 20분마다 자동 동기화</li>
        </ol>
        <div class="code" style="margin-top:14px">
          <input class="field" readonly type=${showCode ? "text" : "password"} value=${user.refreshToken} aria-label="연동 코드" />
          <button class="btn sm" onClick=${() => setShowCode(!showCode)}>${showCode ? "숨기기" : "보기"}</button>
          <button class="btn sm primary" onClick=${copy}>복사</button>
        </div>
        <p class="desc" style="margin:10px 0 0;font-size:12px">이 코드는 비밀번호처럼 다뤄 주세요. 다른 사람에게 공유하지 마세요.</p>
      </div>
      <div class="panel pad" style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;font-size:13.5px;min-width:0"><b>${user.displayName}</b><div style="color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis">${user.email}</div></div>
        <button class="btn sm" onClick=${() => signOut(auth)}>로그아웃</button>
      </div>
    </div>
  </div>`;
}

render(html`<${App} />`, document.getElementById("root"));
</script>
</body>
</html>
