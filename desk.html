<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진도표 바탕화면</title>
<link rel="stylesheet" href="theme.css">
<style>
/* 바탕화면용(Lively Wallpaper). 1280×720 기준으로 그리고 화면 크기에 맞춰 키움.
   왼쪽 140px 은 바탕화면 아이콘, 아래 62px 은 작업 표시줄 자리. 색·글꼴은 theme.css */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { -webkit-font-smoothing: antialiased; user-select: none; }
/* 지도 위에 바로 놓인 글자: 지도 라벨처럼 흰 테두리 */
.label, .big, .railcap, .notes, .sync, .cap, .wnav .range, .pcol, .col .hd { text-shadow: var(--halo); }
.col.today .hd { text-shadow: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#screen { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: top left; }

.board { position: absolute; inset: 0; padding: 40px 44px 62px 140px; display: grid; grid-template-columns: minmax(0, 1fr) 580px; grid-template-rows: auto 1fr auto auto auto auto; column-gap: 30px; row-gap: 16px; }
.label { grid-column: 1; font-size: 14px; color: var(--muted); display: flex; gap: 14px; align-items: baseline; }
.label b { color: var(--hl); font-weight: 600; }
.big { grid-column: 1; grid-row: 2; align-self: center; display: flex; align-items: baseline; gap: 22px; font-family: var(--serif); min-width: 0; }
.big .cls { font-size: 132px; font-weight: 700; line-height: .9; letter-spacing: -.02em; white-space: nowrap; flex: none; }
.big .cls.red { color: var(--red); }
.big .cls.calm { font-size: 72px; letter-spacing: -.02em; }
.big .what { font-size: 27px; font-weight: 600; line-height: 1.3; letter-spacing: -.02em; min-width: 0; }
.big .what small { display: block; font-family: var(--sans); font-size: 14px; color: var(--muted); margin-top: 6px; }

/* 연속 날짜 띠: 진도표 앱처럼 학기 전체가 옆으로 이어짐. 잡고 끌기·휠·‹ › 로 이동, 2분 안 건드리면 오늘로 */
.week { grid-column: 2; grid-row: 1 / 3; align-self: start; min-width: 0; }
.wnav { display: flex; align-items: center; gap: 6px; margin: 0 2px 6px 38px; font-size: 13px; color: var(--muted); }
.wnav button { border: 1px solid var(--seam); background: var(--tint); color: var(--ink); border-radius: 8px; min-width: 34px; height: 30px; padding: 0 10px; font-size: 15px; transition: transform 120ms var(--ease); }
.wnav button:active { transform: scale(.95); }
.wnav .range { min-width: 112px; text-align: center; font-weight: 600; color: var(--ink); }
.wnav .multi { margin-left: auto; font-size: 12.5px; }
.wnav .multi.on { background: var(--water-soft); border-color: var(--hl); color: var(--hl); font-weight: 700; }
.wnav .home { background: var(--hl); color: var(--hl-ink); font-weight: 700; font-size: 13px; }
.tlw { display: flex; }
.pcol, .col { display: flex; flex-direction: column; gap: 4px; flex: none; }
.pcol { width: 38px; padding-right: 6px; }
.pcol .hd { height: 30px; }
.pcol .p { height: 41px; display: grid; place-content: center end; text-align: right; font-weight: 600; font-size: 14px; color: var(--faint); line-height: 1.1; }
.pcol .p small { display: block; font-size: 9.5px; font-weight: 400; color: var(--faint); }
/* 가장자리는 흐리게 사라지게 (더 있다는 표시) */
.scroller { position: relative; flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; cursor: grab;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
.scroller::-webkit-scrollbar { display: none; }
.scroller.drag { cursor: grabbing; }
.scroller.drag button { pointer-events: none; }
.track { display: flex; gap: 4px; width: max-content; padding: 0 12px; }
.col { width: 104px; }
.col.mon { margin-left: 8px; }
.col .hd { height: 30px; display: grid; place-items: center; position: relative; font-size: 13px; color: var(--faint); border-radius: 7px; cursor: pointer; white-space: nowrap; }
.col .hd .m { position: absolute; left: 2px; top: -3px; font-size: 10.5px; font-weight: 700; color: var(--hl); }
.col.today .hd { background: var(--hl); color: var(--hl-ink); font-weight: 700; }
.col.sel .hd { box-shadow: inset 0 0 0 1.5px var(--hl); color: var(--ink); }
.col .c { height: 41px; border-radius: 8px; background: var(--cell); box-shadow: inset 0 0 0 1px var(--cell-line); }
.col.today .c { background: linear-gradient(var(--today-tint), var(--today-tint)), var(--cell); } /* 흰 칸 위에 옅은 파랑 (지도가 비쳐 탁해지지 않게) */
.col .c button { width: 100%; height: 100%; border: 0; border-radius: 8px; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0 5px; position: relative; }
.col .c b { font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.05; } /* 반 이름은 큰 글씨와 같은 고운바탕 */
.col .c i { font-style: normal; font-size: 10.5px; line-height: 1.2; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col .c button.tag b { font-size: 16px; }
/* 진도 글자별 색: 같은 글자 = 같은 색 */
.col .c button.tag, .rail .tag { background: var(--tag); }
/* 여러 칸 고르기(Ctrl+클릭) */
.col .c button.picked, .rail .picked { box-shadow: inset 0 0 0 2px var(--hl), 0 0 0 3px rgba(75,69,184,.22); opacity: 1; }
.col.off { width: 30px; }
.col.off .hd { font-size: 11px; }
.col.off .v { flex: 1; writing-mode: vertical-rl; display: grid; place-items: center; font-size: 11.5px; color: var(--todo); letter-spacing: .05em; border-radius: 8px; background: repeating-linear-gradient(-45deg, transparent 0 5px, var(--stripe) 5px 10px); overflow: hidden; }
.red { color: var(--red) !important; } /* 컴시간에서 바뀐 수업: 반 글씨만 빨간색 */
.week .past { opacity: .5; }
.week .todo { opacity: 1; box-shadow: inset 0 0 0 1.5px var(--todo); }
.col .c button.now { background: var(--now); color: var(--hl-ink); }
.col .c button.now i { color: var(--now-sub); }
.week .ev { opacity: .3; }
.railcap { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin-bottom: -10px; }
.railcap b { color: var(--hl); font-weight: 600; }
.cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-top: 6px; padding-left: 38px; }
.cap b { color: var(--red); font-weight: 600; }

.rail { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.rail > * { border: 0; background: var(--cell); border-radius: 10px; padding: 9px 10px 10px; text-align: left; display: grid; gap: 3px; min-height: 76px; align-content: start; min-width: 0; }
.rail .empty { background: var(--tint); box-shadow: inset 0 0 0 1px var(--seam); }
.rail .p { font-size: 11px; color: var(--faint); }
.rail .c { font-family: var(--display); font-size: 20px; font-weight: 700; }
.rail .s { font-size: 11px; color: var(--muted); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.rail .past { opacity: .55; }
.rail .now { background: var(--now); color: var(--hl-ink); }
.rail .now .p, .rail .now .s { color: var(--now-sub); }
.rail .todo .s { color: var(--todo); font-weight: 600; }
.notes { grid-column: 1 / -1; display: flex; gap: 28px; font-size: 13.5px; color: var(--muted); min-width: 0; }
.notes b { font-weight: 600; color: var(--ink); }
.notes .todo { color: var(--todo); }
.sync { grid-column: 1 / -1; margin-top: -8px; font-size: 11.5px; color: var(--faint); }
.sync .bad { color: var(--todo); }

/* 기록이 들어오면 그 칸이 한 번 반짝 (휴대폰에서 기록한 것이 여기 도착했다는 표시) */
.flash::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; background: var(--hl); opacity: 0; animation: flash 1400ms ease-out; pointer-events: none; }
@keyframes flash { from { opacity: .85; } to { opacity: 0; } }

/* 칸을 눌렀을 때 작은 기록 창 */
.pop { position: absolute; z-index: 5; width: 264px; border-radius: 12px; padding: 6px; background: #fff; color: #17202b;
  box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.35); transform-origin: var(--o, top left); animation: pop 160ms var(--ease); }
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.pop .t { font-size: 12px; color: #5b6670; padding: 6px 8px 4px; line-height: 1.4; }
.pop .t b { color: #17202b; }
.pop button { display: flex; justify-content: space-between; width: 100%; border: 0; background: none; padding: 8px; border-radius: 8px; font-size: 13px; text-align: left; color: #17202b; }
.pop button small { color: #8a939a; }
.pop button:hover { background: #f1f3f2; }
.pop button.del { color: #c0262f; }
.pop input { width: 100%; font: 14px var(--sans); color: #17202b; border: 1px solid var(--seam-2); border-radius: 8px; padding: 8px 10px; margin: 2px 0 6px; user-select: text; outline: none; }
.pop input:focus { border-color: var(--hl); box-shadow: 0 0 0 3px var(--water-soft); }
.pop .sw { display: flex; gap: 5px; align-items: center; padding: 0 2px 6px; }
.pop .sw button { width: 22px; height: 22px; padding: 0; border-radius: 50%; background: var(--tag); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); flex: none; }
.pop .sw button.auto { width: auto; border-radius: 11px; padding: 0 8px; background: #f1f3f2; font-size: 11.5px; color: #5b6670; }
.pop .sw button.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--hl); }
.pop .acts { display: flex; gap: 4px; border-top: 1px solid #eef0f2; padding-top: 4px; }
.pop .acts button { width: auto; flex: 1; justify-content: center; }
.pop .acts .save { background: var(--hl); color: #fff; font-weight: 700; flex: 1.4; }
.pop .acts .save:hover { background: var(--water-hover); }
.pop .hint { font-size: 11px; color: #8a939a; padding: 6px 8px 2px; }

/* 처음 연결 */
.setup { position: absolute; inset: 0; display: grid; place-items: center; padding-left: 100px; }
.setup .box { width: 520px; display: grid; gap: 14px; }
.setup h1 { font-family: var(--serif); font-size: 34px; margin: 0; }
.setup p, .setup li { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }
.setup ol { margin: 0; padding-left: 20px; }
.setup .row { display: flex; gap: 8px; }
.setup input { flex: 1; min-width: 0; font: 13px ui-monospace, monospace; color: var(--ink); background: var(--solid); border: 1px solid var(--seam-2); border-radius: 10px; padding: 10px 12px; user-select: text; }
.setup .go { border: 0; border-radius: 10px; padding: 10px 16px; background: var(--hl); color: var(--hl-ink); font-weight: 700; }
.setup .err { color: var(--todo); }
@media (prefers-reduced-motion: reduce) { .flash::after, .pop { animation: none; } }
</style>
</head>
<body>
<div id="screen"></div>
<script type="module">
import { FB_CONFIG, APP_ID, BELL, PERIODS, WD, YEAR_END, iso, fromIso, addDays, isWeekend, md, atTime, slotKey, nextSchoolDay, buildModel, slotInfo, lessonDoc } from "./model.js";

// ---------- 연결: 진도표 앱의 'PC 연동 코드'(로그인 갱신 토큰)로 접속 ----------
// 바탕화면 프로그램 안에서는 구글 로그인이 막혀서, 알림이 연동 키트와 같은 방식(REST)을 씀
const CODE_KEY = "desk-code", CACHE_KEY = "desk-cache";
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { } } };
// Lively 에 주소를 넣을 때 desk.html#code=… 로 넣을 수 있게 (주소 뒤 # 부분은 인터넷으로 전송되지 않음)
const hashCode = new URLSearchParams(location.hash.slice(1)).get("code");
if (hashCode) { store.set(CODE_KEY, hashCode); history.replaceState(null, "", location.pathname); }
let code = store.get(CODE_KEY);
let idToken = null, uid = null, tokenExp = 0;
class AuthError extends Error { }

async function token() {
  if (idToken && Date.now() < tokenExp - 60000) return idToken;
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_CONFIG.apiKey}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ grant_type: "refresh_token", refresh_token: code }),
  });
  if (r.status === 400 || r.status === 401 || r.status === 403) throw new AuthError();
  if (!r.ok) throw new Error(`token ${r.status}`);
  const j = await r.json();
  idToken = j.id_token; uid = j.user_id; tokenExp = Date.now() + j.expires_in * 1000;
  if (j.refresh_token && j.refresh_token !== code) { code = j.refresh_token; store.set(CODE_KEY, code); }
  return idToken;
}
const base = () => `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/artifacts/${APP_ID}/users/${uid}`;
async function api(path, opt = {}) {
  const t = await token();
  const r = await fetch(base() + path, { ...opt, headers: { Authorization: `Bearer ${t}`, "Content-Type": "application/json" } });
  if (r.status === 401 || r.status === 403) { idToken = null; throw new AuthError(); }
  if (!r.ok) throw new Error(`firestore ${r.status}`);
  return r.json();
}
// Firestore REST 값 ↔ JS 값
const val = v => "stringValue" in v ? v.stringValue : "integerValue" in v ? +v.integerValue : "doubleValue" in v ? v.doubleValue
  : "booleanValue" in v ? v.booleanValue : "timestampValue" in v ? new Date(v.timestampValue)
  : "mapValue" in v ? fields(v.mapValue.fields) : "arrayValue" in v ? (v.arrayValue.values || []).map(val) : null;
const fields = f => Object.fromEntries(Object.entries(f || {}).map(([k, v]) => [k, val(v)]));
const enc = x => typeof x === "string" ? { stringValue: x } : typeof x === "boolean" ? { booleanValue: x } : Number.isInteger(x) ? { integerValue: String(x) } : { doubleValue: x };
const docId = d => d.name.split("/").pop();
async function list(col) {
  const out = [];
  let pt = "";
  do {
    const j = await api(`/${col}?pageSize=300${pt ? `&pageToken=${encodeURIComponent(pt)}` : ""}`);
    for (const d of j.documents || []) out.push([docId(d), fields(d.fields)]);
    pt = j.nextPageToken;
  } while (pt);
  return out;
}

// ---------- 데이터 (마지막 상태는 이 PC 에 저장해 두고 켜자마자 보여 줌) ----------
let data = { meta: {}, lessons: {}, events: [] };
let lastAt = 0, checkedAt = null, problem = "", flashKeys = new Set();
try {
  const c = JSON.parse(store.get(CACHE_KEY));
  if (c) { data = c; const t = data.meta.timetable; if (t?.syncedAt) t.syncedAt = new Date(t.syncedAt); }
} catch { }
// at 이 숫자가 아닌 옛 기록(날짜형 등)은 건너뜀. 섞이면 NaN 이 되어 새 기록 확인이 멈춤
const bumpAt = () => { lastAt = Math.max(0, ...Object.values(data.lessons).map(l => Number.isFinite(l.at) ? l.at : 0)); };
bumpAt();
const save = () => store.set(CACHE_KEY, JSON.stringify(data));

async function loadMeta() { data.meta = Object.fromEntries(await list("meta")); }
async function loadAll() {
  const [meta, lessons, events] = await Promise.all([list("meta"), list("lessons"), list("events")]);
  data = { meta: Object.fromEntries(meta), lessons: Object.fromEntries(lessons), events: events.map(([id, e]) => ({ id, ...e })) };
  bumpAt();
}
// 새 기록만 가져오기 (휴대폰에서 기록한 것이 여기로 옴). 바뀐 문서 수만큼만 읽어서 하루 종일 켜 둬도 가벼움
async function loadNew() {
  const rows = await api(":runQuery", { method: "POST", body: JSON.stringify({ structuredQuery: {
    from: [{ collectionId: "lessons" }],
    where: { fieldFilter: { field: { fieldPath: "at" }, op: "GREATER_THAN", value: { integerValue: String(lastAt) } } },
  } }) });
  const got = rows.filter(r => r.document).map(r => [docId(r.document), fields(r.document.fields)]);
  for (const [k, l] of got) { data.lessons[k] = l; flashKeys.add(k); }
  bumpAt();
  return got.length;
}
async function run(job) {
  try { const n = await job(); problem = ""; checkedAt = new Date(); save(); return n; }
  catch (e) {
    if (e instanceof AuthError) { problem = "auth"; }
    else problem = "net";
    console.warn(e);
  } finally { draw(); }
}

// ---------- 화면 ----------
const screen = document.getElementById("screen");
const hm = d => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function state(m, s, now) {
  if (s.event) return "ev";
  if (m.lessons[slotKey(s.date, s.p)]) return "done";
  if (atTime(s.date, BELL[s.p][1]) <= now) return "todo";
  if (atTime(s.date, BELL[s.p][0]) <= now) return "now";
  return "later";
}
const stepText = (i, s) => s.event ? s.event.title : i.name;
// 기록의 진도 글자: 직접 쓴 글자, 없으면 차시 계획 이름
const topicOf = (m, l) => l.skip ? "" : l.topic || (l.step ? m.planName(l.c, l.step) : "");
// 진도 글자 → 색 번호(0~7). 같은 글자 = 같은 색, 새 글자는 나온 순서대로 다음 색. 직접 고른 색이 있으면 가장 최근에 고른 색
function tagColors(m) {
  const auto = new Map(), pick = new Map();
  for (const k of Object.keys(m.lessons).sort()) {
    const l = m.lessons[k], t = topicOf(m, l);
    if (!t) continue;
    if (!auto.has(t)) auto.set(t, auto.size % 8);
    if (Number.isInteger(l.color) && !((pick.get(t)?.[0] || 0) > (l.at || 0))) pick.set(t, [l.at || 0, l.color]);
  }
  return t => pick.has(t) ? pick.get(t)[1] : auto.get(t);
}

// 그리다 오류가 나면 빈 화면 대신 무엇이 문제인지 보여 줌
function draw() {
  if (drag?.moved || pop) return; // 끄는 중·진도 입력 중에는 다시 그리지 않음 (끝나면 다시 그림)
  try { drawBoard(); }
  catch (e) {
    console.error(e);
    screen.innerHTML = `<div class="setup"><div class="box"><h1>화면을 그리지 못했어요</h1><p>아래 내용을 알려 주시면 고칠게요.</p><p class="err" style="user-select:text">${esc(e?.stack || e)}</p></div></div>`;
  }
  fit();
}
function drawBoard() {
  if (!code) return drawSetup();
  if (problem === "auth") return drawSetup("연동 코드가 맞지 않거나 만료됐어요. 진도표 앱 설정에서 새로 복사해 붙여 넣어 주세요.");
  const m = buildModel(data), now = new Date(), today = iso(now), colorOf = tagColors(m);
  if (!m.tt) { screen.innerHTML = `<div class="setup"><div class="box"><h1>${problem ? "연결하는 중…" : "시간표를 기다리는 중"}</h1><p>${problem === "net" ? "인터넷 연결을 확인하고 있어요." : "알림이 PC 에서 시간표가 아직 올라오지 않았어요. 알림이 연동 키트가 한 번 돌면 자동으로 나타나요."}</p></div></div>`; return; }

  // 기준 날: 주말이면 다음 수업일. 날짜 띠는 학기 첫날부터 학년 끝까지 이어짐
  const schoolDay = isWeekend(today) ? nextSchoolDay(today) : today;
  const todaySlots = m.slotsFor(schoolDay);
  const railDay = selDay || schoolDay, railSlots = m.slotsFor(railDay); // 아래 하루 줄: 요일을 누르면 그날
  const pending = m.pending(now).reverse(); // 최근 것부터

  // 지금 수업 / 다음 수업
  const live = todaySlots.filter(s => s.c);
  let label, focus, after;
  const cur = schoolDay === today && live.find(s => state(m, s, now) === "now");
  const next = live.find(s => schoolDay !== today || atTime(s.date, BELL[s.p][0]) > now);
  if (cur) {
    const left = Math.round((atTime(today, BELL[cur.p][1]) - now) / 60000);
    label = `<b>지금 ${cur.p}교시</b><span>${BELL[cur.p][0]}–${BELL[cur.p][1]}, 끝나기까지 ${left}분</span>`;
    focus = cur; after = next && next !== cur ? next : live.find(s => s.p > cur.p);
  } else if (next) {
    const mins = Math.round((atTime(next.date, BELL[next.p][0]) - now) / 60000);
    label = schoolDay === today
      ? `<b>다음 ${next.p}교시</b><span>${BELL[next.p][0]} 시작, ${mins < 60 ? `${mins}분 뒤` : `${Math.floor(mins / 60)}시간 ${mins % 60}분 뒤`}</span>`
      : `<b>${md(schoolDay)} ${WD[fromIso(schoolDay).getDay()]}요일 ${next.p}교시</b><span>${BELL[next.p][0]} 시작</span>`;
    focus = next; after = live.find(s => s.p > next.p);
  } else {
    label = `<b>오늘 수업 끝</b><span>${pending.length ? "기록 전 수업을 확인하세요" : "수고하셨어요"}</span>`;
  }
  const off = m.dayOff(schoolDay);
  let big;
  if (off) { label = `<b>${md(schoolDay)} ${WD[fromIso(schoolDay).getDay()]}요일</b><span>수업 없는 날</span>`; big = `<div class="cls calm">${esc(off.title)}</div>`; }
  else if (focus) {
    const i = slotInfo(m, focus);
    big = `<div class="cls ${focus.changed ? "red" : ""}">${focus.c}</div><div class="what">${esc(stepText(i, focus)) || "진도 계획 전"}${after ? `<small>다음 시간: ${after.p}교시 ${after.c}</small>` : ""}</div>`;
  } else {
    const nd = nextSchoolDay(today), first = m.slotsFor(nd).find(s => s.c);
    big = first ? `<div class="cls calm">내일 ${first.p}교시 <span class="${first.changed ? "red" : ""}">${first.c}</span></div>` : `<div class="cls calm">내일 수업 없음</div>`;
  }

  const fl = s => flashKeys.has(slotKey(s.date, s.p)) ? " flash" : "";
  // 기록한 칸은 진도 글자와 그 글자의 색, 기록 안 한 지난 칸은 흐리게
  const look = (s, st, i) => {
    const t = i.l && topicOf(m, i.l), k = slotKey(s.date, s.p);
    const cls = (st === "now" ? "now" : st === "todo" ? "todo past" : st === "ev" ? "ev" : !t && atTime(s.date, BELL[s.p][1]) <= now ? "past" : "")
      + (t ? " tag" : "") + (picked.has(k) ? " picked" : "") + fl(s);
    return { t, k, cls, style: t ? ` style="--tag:var(--tag${colorOf(t)})"` : "" };
  };
  const cell = (date, s) => {
    if (!s?.c) return `<div class="c"></div>`; // 빠진 수업·공강은 빈칸
    const st = state(m, s, now), i = slotInfo(m, s), { t, k, cls, style } = look(s, st, i);
    return `<div class="c"><button class="${cls}" data-k="${k}"${style} title="${esc(stepText(i, s))}"><b class="${s.changed ? "red" : ""}">${s.c}</b>${t ? `<i>${esc(t)}</i>` : i.l?.skip ? "<i>수업 못함</i>" : ""}</button></div>`;
  };
  const start = m.firstDay && m.firstDay < schoolDay ? m.firstDay : addDays(schoolDay, -28);
  const days = [];
  for (let d = start; d <= YEAR_END; d = addDays(d, 1)) if (!isWeekend(d)) days.push(d);
  const col = (d, i) => {
    const dt = fromIso(d), off = m.dayOff(d), month = i === 0 || days[i - 1].slice(0, 7) !== d.slice(0, 7);
    const cls = `col${dt.getDay() === 1 && i ? " mon" : ""}${d === schoolDay ? " today" : ""}${d === selDay ? " sel" : ""}${off ? " off" : ""}`;
    const hd = `<div class="hd" data-day="${d}" title="${esc(off?.title || "")}">${month ? `<span class="m">${dt.getMonth() + 1}월</span>` : ""}${off ? dt.getDate() : `${WD[dt.getDay()]} ${dt.getDate()}`}</div>`;
    if (off) return `<div class="${cls}" data-col="${d}">${hd}<div class="v">${esc(off.title.replace(/\(.*?\)/g, "").trim())}</div></div>`;
    const slots = m.slotsFor(d);
    return `<div class="${cls}" data-col="${d}">${hd}${PERIODS.map(p => cell(d, slots[p - 1])).join("")}</div>`;
  };
  const week = `<div class="wnav"><button data-nav="-1" aria-label="앞 날짜로">‹</button><span class="range"></span><button data-nav="1" aria-label="뒤 날짜로">›</button><button class="multi${multi ? " on" : ""}" data-multi title="켜면 누르는 칸마다 여러 칸이 골라져요 (Ctrl+클릭과 같음)">여러 칸</button><button class="home" data-nav="0"${tlScroll === null && !selDay ? " hidden" : ""}>오늘로</button></div>
    <div class="tlw"><div class="pcol"><div class="hd"></div>${PERIODS.map(p => `<div class="p">${p}<small>${BELL[p][0]}</small></div>`).join("")}</div>
      <div class="scroller"><div class="track">${days.map(col).join("")}</div></div></div>
    <div class="cap"><span>칸 누르면 진도 입력, Ctrl+클릭은 여러 칸</span><span><b>빨간 반</b> 바뀐 수업, 빈칸 빠진 수업</span></div>`;

  const rail = PERIODS.map(p => {
    const s = railSlots[p - 1];
    if (!s?.c) return `<div class="empty"><span class="p">${p}교시</span></div>`;
    const st = state(m, s, now), i = slotInfo(m, s), { k, cls, style } = look(s, st, i);
    return `<button class="${cls}" data-k="${k}"${style}><span class="p">${p}교시 ${BELL[p][0]}</span><span class="c ${s.changed ? "red" : ""}">${s.c}</span><span class="s">${st === "todo" ? "기록 전" : esc(stepText(i, s))}</span></button>`;
  }).join("");

  const nd = nextSchoolDay(schoolDay), ndSlots = m.slotsFor(nd).filter(s => s.c);
  const nameNd = nd === addDays(today, 1) ? "내일" : `${md(nd)}`;
  const notes = `${pending.length ? `<span class="todo">기록 전: ${pending.slice(0, 4).map(s => `${WD[fromIso(s.date).getDay()]} ${s.p}교시 ${s.c}`).join(", ")}${pending.length > 4 ? ` 외 ${pending.length - 4}개` : ""}</span>` : "<span>밀린 기록 없음</span>"}
    <span><b>${nameNd}(${WD[fromIso(nd).getDay()]})</b> ${m.dayOff(nd) ? esc(m.dayOff(nd).title) : ndSlots.length ? ndSlots.map(s => `${s.p}교시 <span class="${s.changed ? "red" : ""}">${s.c}</span>`).join(", ") : "수업 없음"}</span>`;
  const sync = `컴시간 ${esc(m.tt.savedAt?.slice(5, 16).replace("-", "/"))} 저장분, ${problem === "net" ? `<span class="bad">인터넷 연결 끊김 (마지막 확인 ${checkedAt ? hm(checkedAt) : "-"})</span>` : `마지막 확인 ${checkedAt ? hm(checkedAt) : "-"}`}`;

  screen.innerHTML = `<div class="board">
    <div class="label">${label}</div>
    <div class="big">${big}</div>
    <div class="week">${week}</div>
    <div class="railcap">${railDay === today ? "<b>오늘</b> 수업" : `<b>${md(railDay)} ${WD[fromIso(railDay).getDay()]}요일</b> 수업${m.dayOff(railDay) ? `, ${esc(m.dayOff(railDay).title)}` : ""}`}</div>
    <div class="rail">${rail}</div>
    <div class="notes">${notes}</div>
    <div class="sync">${sync}</div>
  </div>`;
  flashKeys.clear();
  mountTimeline(schoolDay);
}

function drawSetup(err = "") {
  screen.innerHTML = `<div class="setup"><div class="box">
    <h1>바탕화면 진도표 연결</h1>
    <ol>
      <li>휴대폰이나 PC 에서 진도표 앱을 열고 <b>설정 → PC 연동 → 복사</b></li>
      <li>아래 칸에 붙여 넣고 <b>연결</b></li>
    </ol>
    <p>붙여 넣기가 안 되면 Lively 에 주소를 <b>desk.html#code=복사한코드</b> 로 넣어도 돼요.</p>
    <div class="row"><input id="code" type="password" placeholder="PC 연동 코드" autocomplete="off"><button class="go" id="go">연결</button></div>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}
    <p style="font-size:12.5px;color:var(--faint)">이 코드는 비밀번호와 같아요. 이 PC 에만 저장돼요.</p>
  </div></div>`;
  document.getElementById("go").onclick = () => {
    const v = document.getElementById("code").value.trim();

    code = v; store.set(CODE_KEY, v); idToken = null; problem = "";
    run(loadAll);
  };
}

// ---------- 칸을 눌러 진도 입력. Ctrl+클릭(또는 '여러 칸' 켜고 클릭)으로 여러 칸을 한 번에 ----------
// picked: 고른 칸들, draft: 쓰는 중인 진도 글자와 색 (Ctrl+클릭으로 칸을 더해도 그대로)
let pop = null, picked = new Set(), multi = false, draft = null;
const markPicked = (k, on) => screen.querySelectorAll(`[data-k="${k}"]`).forEach(x => x.classList.toggle("picked", on));
const closePop = () => {
  const was = pop;
  pop?.remove(); pop = null; draft = null;
  for (const k of picked) markPicked(k, false);
  picked.clear();
  if (was) draw(); // 입력하는 동안 미뤄 둔 새 기록 반영
};
const slotOf = (m, k) => m.slotsFor(k.slice(0, 10))[+k.slice(11) - 1];

function openPop(anchor) {
  pop?.remove();
  const m = buildModel(data), colorOf = tagColors(m);
  const slots = [...picked].sort().map(k => slotOf(m, k)).filter(s => s?.c);
  if (!slots.length) return closePop();
  const f = slots[0], ex = m.lessons[slotKey(f.date, f.p)], fi = slotInfo(m, f), plan = fi.step ? m.planName(f.c, fi.step) : "";
  draft ||= { text: ex ? topicOf(m, ex) : plan, color: Number.isInteger(ex?.color) ? ex.color : null };
  // 전에 쓴 진도 글자를 골라 넣을 수 있게 (같은 글자 = 같은 색)
  const topics = [...new Set(Object.keys(m.lessons).sort().reverse().map(k => topicOf(m, m.lessons[k])).filter(Boolean))].slice(0, 40);
  const anyRec = slots.some(s => m.lessons[slotKey(s.date, s.p)]);
  const head = slots.length === 1
    ? `${md(f.date)}(${WD[fromIso(f.date).getDay()]}) ${f.p}교시 <b>${f.c}</b><br>${ex ? `기록: ${esc(topicOf(m, ex) || "수업 못함")}` : `계획: ${esc(plan || "없음")}`}`
    : `<b>${slots.length}칸</b> · ${slots.slice(0, 6).map(s => `${WD[fromIso(s.date).getDay()]}${s.p} ${s.c}`).join(", ")}${slots.length > 6 ? ` 외 ${slots.length - 6}` : ""}`;
  const auto = draft.text.trim() ? colorOf(draft.text.trim()) : null; // '자동'이면 지금 이 색
  pop = document.createElement("div");
  pop.className = "pop";
  pop.innerHTML = `<div class="t">${head}</div>
    <input list="topics" value="${esc(draft.text)}" placeholder="진도 (예: 광합성 실험)" autocomplete="off">
    <datalist id="topics">${topics.map(t => `<option value="${esc(t)}">`).join("")}</datalist>
    <div class="sw"><button class="auto${draft.color === null ? " on" : ""}" data-color="" title="같은 글자는 같은 색으로">자동</button>${[0, 1, 2, 3, 4, 5, 6, 7].map(n => `<button data-color="${n}" style="--tag:var(--tag${n})" class="${draft.color === n ? "on" : ""}" aria-label="색 ${n + 1}"${auto === n ? ` title="자동이면 이 색"` : ""}></button>`).join("")}</div>
    <div class="acts"><button class="save" data-r="save">저장</button><button data-r="skip">수업 못함</button>${anyRec ? `<button data-r="del" class="del">지우기</button>` : ""}</div>
    ${slots.length === 1 ? `<div class="hint">Ctrl+클릭으로 여러 칸에 한 번에 입력</div>` : ""}`;
  pop.style.visibility = "hidden";
  screen.appendChild(pop);
  const sr = screen.getBoundingClientRect(), br = anchor.getBoundingClientRect(), z = sr.width / 1280, w = pop.offsetWidth, h = pop.offsetHeight;
  let x = (br.left - sr.left) / z, y = (br.bottom - sr.top) / z + 6, o = "top left";
  if (x + w > 1270) { x = (br.right - sr.left) / z - w; o = "top right"; }
  if (y + h > 710) { y = (br.top - sr.top) / z - h - 6; o = o.replace("top", "bottom"); }
  pop.style.cssText = `left:${x}px;top:${Math.max(6, y)}px;--o:${o}`;
  const input = pop.querySelector("input");
  input.addEventListener("input", () => { draft.text = input.value; });
  // 한글 입력 중의 Enter 는 글자 확정이라 저장하지 않음
  input.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.isComposing) { ev.preventDefault(); saveAll("save"); } });
  pop.addEventListener("click", ev => {
    ev.stopPropagation(); // 창 안을 눌러도 닫히지 않게
    const c = ev.target.closest("[data-color]");
    if (c) {
      draft.color = c.dataset.color === "" ? null : +c.dataset.color;
      pop.querySelectorAll("[data-color]").forEach(x => x.classList.toggle("on", x === c));
      return input.focus();
    }
    const r = ev.target.closest("[data-r]")?.dataset.r;
    if (r) return saveAll(r);
    input.focus(); // 빈 곳을 눌러도 바로 이어서 쓰고 Enter 로 저장
  });
  input.focus(); input.select();
}

// 고른 칸 전부에 저장. 화면은 바로, 저장은 뒤에서. (반짝임은 휴대폰 등 다른 곳에서 들어온 기록에만)
async function saveAll(kind) {
  const keys = [...picked].sort(), text = draft.text.trim(), color = draft.color, jobs = [];
  pop?.remove(); pop = null; draft = null; picked.clear();
  for (const k of keys) {
    if (kind === "del") { if (data.lessons[k]) { delete data.lessons[k]; jobs.push(() => api(`/lessons/${k}`, { method: "DELETE" })); } continue; }
    const m = buildModel(data), s = slotOf(m, k); // 같은 반 여러 칸이면 앞 칸 기록을 보고 다음 칸을 정하므로 매번 다시 계산
    if (!s?.c) continue;
    const note = m.lessons[k]?.note;
    let rec = { skip: true, note };
    if (kind === "save") {
      // 화면에는 글자만. 차시 번호(진도표 앱 진행률용)는 알아서: 앞 시간과 같은 글자면 이어서, 다르면 다음 차시
      const prev = m.stepBefore(s.c, k), last = (m.byClass[s.c] || []).filter(l => l.k < k && !l.skip).pop();
      const same = text && last && topicOf(m, last) === text;
      rec = { step: same ? last.step || prev : prev + 1, topic: text, color, note };
    }
    const doc = data.lessons[k] = lessonDoc(s, rec);
    jobs.push(() => api(`/lessons/${k}`, { method: "PATCH", body: JSON.stringify({ fields: Object.fromEntries(Object.entries(doc).map(([a, v]) => [a, enc(v)])) }) }));
  }
  bumpAt(); draw();
  await run(() => Promise.all(jobs.map(j => j())));
}
// ---------- 날짜 띠 이동: 잡고 끌기(놓으면 관성) · 휠 · ‹ › · 오늘로. 2분 안 건드리면 오늘로 ----------
// tlScroll: 사용자가 옮겨 둔 위치(null 이면 오늘 기준). 화면을 다시 그려도 이 위치를 지킴
let tlScroll = null, quietUntil = 0, selDay = null, navAt = 0, zoom = 1, glide = 0, drag = null, eatClick = false;
const tlEl = () => screen.querySelector(".scroller");
const todayLeft = (tl, d) => { const c = tl.querySelector(`[data-col="${d}"]`); return c ? Math.max(0, c.offsetLeft - c.offsetWidth - 16) : 0; };
function mountTimeline(schoolDay) {
  const tl = tlEl();
  if (!tl) return;
  cancelAnimationFrame(glide);
  quietUntil = Date.now() + 200; // 위치를 되돌리는 건 사용자 조작으로 치지 않음
  tl.dataset.today = schoolDay;
  tl.scrollLeft = tlScroll ?? todayLeft(tl, schoolDay);
  showRange(tl);
  // 터치 화면 등 그 밖의 스크롤도 기억 (휠·끌기·버튼은 moved() 가 바로 기억)
  tl.addEventListener("scroll", () => { if (Date.now() > quietUntil) moved(tl); }, { passive: true });
}
// 사용자가 옮긴 위치를 기억: 다시 그려도 그대로, '오늘로' 버튼 보이기, 보이는 날짜 범위 갱신
function moved(tl, pos = tl.scrollLeft) {
  tlScroll = Math.max(0, Math.min(pos, tl.scrollWidth - tl.clientWidth)); navAt = Date.now();
  screen.querySelector(".wnav .home")?.removeAttribute("hidden");
  showRange(tl, tlScroll);
}
// 지금 보이는 날짜 범위 (예: 10/19 – 10/23)
function showRange(tl, pos = tl.scrollLeft) {
  const a = pos + 20, b = pos + tl.clientWidth - 20;
  let first, last;
  for (const c of tl.querySelectorAll(".col[data-col]:not(.off)")) {
    if (!first && c.offsetLeft + c.offsetWidth > a) first = c.dataset.col;
    if (c.offsetLeft < b) last = c.dataset.col;
  }
  const el = screen.querySelector(".wnav .range");
  if (el && first) el.textContent = `${md(first)} – ${md(last)}`;
}

screen.addEventListener("click", e => {
  if (eatClick) { eatClick = false; e.stopPropagation(); return; } // 끌고 난 뒤의 클릭은 무시
  // ‹ › · 오늘로 · 요일 고르기
  const nav = e.target.closest("[data-nav]"), day = e.target.closest("[data-day]");
  if (nav || day) {
    e.stopPropagation(); closePop(); navAt = Date.now();
    const tl = tlEl();
    if (nav) {
      const n = +nav.dataset.nav;
      if (n && tl) { const to = tl.scrollLeft + n * 5 * 108; quietUntil = Date.now() + 700; tl.scrollTo({ left: to, behavior: "smooth" }); moved(tl, to); }
      else {
        tlScroll = null; selDay = null; quietUntil = Date.now() + 900;
        tl?.scrollTo({ left: todayLeft(tl, tl.dataset.today), behavior: "smooth" });
        setTimeout(draw, 600);
      }
      return;
    }
    selDay = day.dataset.day === selDay ? null : day.dataset.day;
    return draw();
  }
  if (e.target.closest("[data-multi]")) { e.stopPropagation(); closePop(); multi = !multi; return draw(); }
  const b = e.target.closest("[data-k]");
  if (!b) return;
  e.stopPropagation();
  const k = b.dataset.k;
  if (!(e.ctrlKey || e.metaKey || multi)) closePop(); // 그냥 클릭: 이 칸 하나만
  else if (picked.has(k)) { // 고른 칸을 다시 누르면 빼기
    picked.delete(k); markPicked(k, false);
    return picked.size ? openPop(b) : closePop();
  }
  picked.add(k); markPicked(k, true);
  openPop(b);
});
document.addEventListener("click", closePop);
document.addEventListener("keydown", e => e.key === "Escape" && closePop());

// 마우스 휠: 진도표 앱처럼 연속으로 옆 이동 (아래로 굴리면 미래). Lively 실제 바탕화면은 휠을 안 넘겨줘서 끌기를 씀
screen.addEventListener("wheel", e => {
  const tl = tlEl();
  if (!tl) return;
  e.preventDefault(); cancelAnimationFrame(glide);
  tl.scrollLeft += (Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX) * 1.2;
  moved(tl);
}, { passive: false });

// 잡고 끌기: 손(마우스)을 1:1 로 따라오고, 놓으면 그 속도로 미끄러지다 멈춤
screen.addEventListener("pointerdown", e => {
  const tl = e.target.closest(".scroller");
  if (!tl || e.button > 0) return;
  cancelAnimationFrame(glide);
  drag = { tl, x: e.clientX, sl: tl.scrollLeft, id: e.pointerId, moved: false, hist: [] };
});
addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = (e.clientX - drag.x) / zoom;
  if (!drag.moved) {
    if (Math.abs(dx) < 6) return; // 살짝 떨린 클릭은 클릭으로
    drag.moved = true; drag.tl.classList.add("drag");
    try { drag.tl.setPointerCapture(drag.id); } catch { }
  }
  drag.tl.scrollLeft = drag.sl - dx;
  moved(drag.tl);
  drag.hist.push([e.timeStamp, drag.tl.scrollLeft]);
  while (drag.hist.length > 2 && e.timeStamp - drag.hist[0][0] > 80) drag.hist.shift();
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null; d.tl.classList.remove("drag");
  if (!d.moved) return;
  eatClick = true; setTimeout(() => { eatClick = false; }, 0);
  d.hist.push([e.timeStamp, d.tl.scrollLeft]);
  while (d.hist.length > 2 && e.timeStamp - d.hist[0][0] > 80) d.hist.shift(); // 멈췄다 놓으면 속도 0
  const [a, b] = [d.hist[0], d.hist[d.hist.length - 1]];
  let v = b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) : 0; // px/ms
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) v = 0;
  const step = () => { if (Math.abs(v) < 0.02) return; d.tl.scrollLeft += v * 16; moved(d.tl); v *= 0.95; glide = requestAnimationFrame(step); };
  glide = requestAnimationFrame(step);
}
addEventListener("pointerup", endDrag);
addEventListener("pointercancel", endDrag);

// 1280×720 을 화면에 꽉 차게 (남는 쪽은 가운데 정렬).
// Lively 는 처음에 창 크기를 0 으로 알려 줄 때가 있어서, 0 이면 1배로 두고 크기가 잡히는 대로 다시 맞춤
function fit() {
  const w = document.documentElement.clientWidth || innerWidth, h = document.documentElement.clientHeight || innerHeight;
  if (!w || !h) { screen.style.transform = ""; zoom = 1; return; }
  const z = zoom = Math.min(w / 1280, h / 720);
  screen.style.transform = `translate(${(w - 1280 * z) / 2}px, ${(h - 720 * z) / 2}px) scale(${z})`;
}
addEventListener("resize", fit);
new ResizeObserver(fit).observe(document.documentElement);
addEventListener("error", e => { if (!screen.innerHTML) screen.innerHTML = `<div class="setup"><div class="box"><h1>불러오지 못했어요</h1><p class="err" style="user-select:text">${esc(e.message)}</p></div></div>`; });

// ---------- 주기 ----------
// 새 기록 15초, 시간표·차시 계획 5분, 전체(지운 기록 반영) 30분, 화면 시계 30초
draw();
if (code) run(loadAll);
setInterval(() => code && problem !== "auth" && run(loadNew), 15000);
setInterval(() => code && problem !== "auth" && run(loadMeta), 5 * 60000);
setInterval(() => code && problem !== "auth" && run(loadAll), 30 * 60000);
setInterval(() => {
  if ((tlScroll !== null || selDay) && Date.now() - navAt > 120000) { tlScroll = null; selDay = null; } // 2분 지나면 오늘로
  if (!pop && !drag) draw();
}, 30000);
addEventListener("online", () => code && run(loadNew));
document.addEventListener("visibilitychange", () => !document.hidden && code && run(loadNew));
</script>
